[strategy]
code = "t split_vc exit"
desc = "Split@ the@ VC@ into@ subgoals"
name = "Split_VC"
shortcut = "s"

[strategy]
code = "start:
c Alt-Ergo,2.6.2 .2 1000
c Z3,4.15.3 .2 1000
c CVC5,1.3.1 .2 1000
c CVC4,1.8 .2 1000
c Alt-Ergo,2.6.2 1 1000 | Z3,4.15.3 1 1000 | CVC5,1.3.1 1 1000 | CVC4,1.8 1 1000
t compute_specified start
t split_vc start
c Alt-Ergo,2.6.2 2 4000 | Z3,4.15.3 2 4000 | CVC5,1.3.1 2 4000 | CVC4,1.8 2 4000
"
desc = "Automatic@ run@ of@ provers@ and@ most@ useful@ transformations"
name = "Creusot_Auto"
shortcut = "4"

[strategy]
code = "start:
c CVC5,1.3.1 1. 1000
c Z3,4.15.3 1. 1000
c Alt-Ergo,2.6.2 1. 1000
c CVC4,1.8 1. 1000
t split_vc start
c CVC5,1.3.1 5. 2000 | Z3,4.15.3 5. 2000 | Alt-Ergo,2.6.2 5. 2000 | CVC4,1.8 5. 2000
t introduce_premises afterintro
afterintro:
t inline_goal afterinline
g trylongertime
afterinline:
t split_all_full start
trylongertime:
c CVC5,1.3.1 30. 4000 | Z3,4.15.3 30. 4000 | Alt-Ergo,2.6.2 30. 4000 | CVC4,1.8 30. 4000
"
desc = "Automatic@ run@ of@ provers@ and@ most@ useful@ transformations"
name = "Auto_level_3"
shortcut = "3"

[strategy]
code = "start:
c CVC5,1.3.1 1. 1000
c Z3,4.15.3 1. 1000
c Alt-Ergo,2.6.2 1. 1000
c CVC4,1.8 1. 1000
t split_vc start
c CVC5,1.3.1 10. 4000 | Z3,4.15.3 10. 4000 | Alt-Ergo,2.6.2 10. 4000 | CVC4,1.8 10. 4000
"
desc = "Automatic@ run@ of@ main@ provers and splitting"
name = "Auto_level_2"
shortcut = "2"

[strategy]
code = "c CVC5,1.3.1 5. 1000 | Z3,4.15.3 5. 1000 | Alt-Ergo,2.6.2 5. 1000 | CVC4,1.8 5. 1000
"
