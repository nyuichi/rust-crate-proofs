[editor pvs]
command = "%l/why3-call-pvs %l/pvs pvs %f"
name = "PVS"

[editor proofgeneral-coq]
command = "emacs --eval \"(setq coq-load-path '((\\\"%l/coq\\\" \\\"Why3\\\")))\" %f"
name = "Emacs/ProofGeneral/Coq"

[editor isabelle-jedit]
command = "isabelle why3 -i %f"
name = "Isabelle/jEdit"

[editor coqide]
command = "coqide -R %l/coq Why3 %f"
name = "CoqIDE"

[main]
default_editor = "xdg-open %f"
loadpath = "/workspace/proof-tools/creusot-data/_opam/share/why3/stdlib"
magic = 14
memlimit = 1000
running_provers_max = 1
timelimit = 5.000000

[prover]
alternative = "noBV"
command = "'/workspace/scratch/httparse-string-model/creusot-data/bin/z3' -smt2 -T:%t sat.random_seed=42 nlsat.randomize=false smt.random_seed=42 %f"
command_steps = "'/workspace/scratch/httparse-string-model/creusot-data/bin/z3' -smt2 sat.random_seed=42 nlsat.randomize=false smt.random_seed=42 rlimit=%S %f"
driver = "z3_471_nobv"
editor = ""
in_place = false
interactive = false
name = "Z3"
shortcut = "z3-nobv"
version = "4.15.3"

[prover]
alternative = "counterexamples"
command = "'/workspace/scratch/httparse-string-model/creusot-data/bin/z3' -smt2 -t:%T sat.random_seed=42 model.compact=false nlsat.randomize=false smt.random_seed=42 -st %f"
command_steps = "'/workspace/scratch/httparse-string-model/creusot-data/bin/z3' -smt2 sat.random_seed=42 model.compact=false nlsat.randomize=false smt.random_seed=42 rlimit=%S -st %f"
driver = "z3_4_12_counterexample"
editor = ""
in_place = false
interactive = false
name = "Z3"
shortcut = "z3-ce"
version = "4.15.3"

