[report]
title = "Exact ASCII byte values and eleven character classifications"
explanation = "For ascii 1.1.0, as_byte returns the exact ASCII code for every valid AsciiChar. The eleven classification methods are correct for all 128 characters: digits are characters '0' through '9'; alphabetic is A-Z or a-z; alphanumeric additionally accepts digits; lowercase and uppercase accept a-z and A-Z respectively; hexdigit accepts 0-9, A-F or a-f. Graphic accepts byte codes 33-126 and printable accepts 32-126. Blank accepts space or tab; whitespace accepts space, tab, LF, CR and FF, rejecting vertical tab; control accepts codes 0-31 or 127. All twelve original bodies terminate normally in the model, including their calls to shared classification helpers."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, standard-library scalar models and Lean kernel are trusted. Proofs split the complete finite AsciiChar type and use kernel-checked logical reduction and proved scalar arithmetic, without native-evaluation trust. The byte-code table contains each actual ASCII variant in code order. Transitive axioms are limited to propext, Classical.choice and Quot.sound; no custom models or local axioms are introduced."
limitations = "Only the twelve named APIs are verified. Input validation, conversion from arbitrary bytes/chars, case conversion, AsciiStr, AsciiString, allocation, serde and unsafe paths remain unproved. Invalid enum representations are outside the input domain. The original is_digit_strange_radixes test fails on the pinned modern Rust because char::is_digit panics at radix 0/1; the distinct is_digit API is not covered. Remaining original tests pass with only that test excluded. All-feature/no-default configurations and other targets were not proved."
environment = "Original crates.io ascii 1.1.0 Rust files and Cargo.toml, archive-compared; default features, x86_64-unknown-linux-gnu. The upstream bindings_with_variant_name lint is disabled through RUSTFLAGS and corresponding official rustdoc doctest-build arguments, without source changes. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean 4.35.0. One union extraction supplies all twelve proofs."
