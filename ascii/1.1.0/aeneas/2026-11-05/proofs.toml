[[tool.proofs]]
api = "<ascii::AsciiChar as Default>::default"
module = "Proofs"
theorem = "Proofs.default_spec"
precondition = "No arguments; returns AsciiChar::Null. Default features, x86_64."

[[tool.proofs]]
api = "AsAsciiStrError::valid_up_to"
module = "Proofs"
theorem = "Proofs.valid_up_to_spec"
precondition = "Every stored usize error index; returns the stored index. This getter theorem does not validate the error-producing operation. Default features, x86_64."

[report]
title = "ASCII predicates, radix behavior and case-insensitive equality"
explanation = "For ascii 1.1.0, as_byte returns the exact ASCII code for every valid AsciiChar. The eleven classification methods are correct for all 128 characters: digits are characters '0' through '9'; alphabetic is A-Z or a-z; alphanumeric additionally accepts digits; lowercase and uppercase accept a-z and A-Z respectively; hexdigit accepts 0-9, A-F or a-f. Graphic accepts byte codes 33-126 and printable accepts 32-126. Blank accepts space or tab; whitespace accepts space, tab, LF, CR and FF, rejecting vertical tab; control accepts codes 0-31 or 127. eq_ignore_ascii_case returns exactly whether the two codes are equal after mapping A-Z to a-z and leaving other codes unchanged; the independent mathematical equivalence is proved for all 128 squared valid pairs. For the AsciiChar implementation of ToAsciiChar, the checked method always returns Ok of the same value and the unchecked method returns that same value. is_ascii_punctuation accepts exactly ASCII intervals 33-47, 58-64, 91-96 and 123-126. The hand-written Default implementation returns the NUL enum value. AsAsciiStrError::valid_up_to returns its stored index; this does not establish that a separate validator found the first invalid byte. The public is_alphabetic, is_alphanumeric, is_lowercase and is_uppercase methods satisfy the same letter/digit predicates. is_whitespace accepts space, tab, LF, CR, VT and FF. For every u32 radix, is_digit returns normally at radix 0-36 and accepts exactly characters whose digit value (0-9 or case-independent A-Z values 10-35) is below the radix; other characters return false. Thus radix 0 always returns false and radix 1 accepts only character '0'. Every radix above 36 panics. The other twenty-three named bodies terminate normally in the model. Separately, Kani directly checked the original checked ToAsciiChar bodies for u8, i8, u16, u32 and char over their complete type domains: Ok exactly for ASCII-range inputs, preserving the codepoint, and Err otherwise. Those five body-check results are separate evidence and are not additional Lean API claims. Seven separate Kani checks also verify original case conversion and mutable writeback, as_char, case-insensitive equality and printable control pictures over all 128 valid characters (all pairs for equality). These establish A-Z/a-z mapping, exact receiver updates, ASCII code preservation and U+2400 control pictures with DEL at U+2421."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, standard-library scalar models and Lean kernel are trusted. Proofs split the complete finite AsciiChar type and use kernel-checked logical reduction and proved scalar arithmetic, without native-evaluation trust. The byte-code table contains each actual ASCII variant in code order. Transitive axioms are limited to propext, Classical.choice and Quot.sound; no custom models or local axioms are introduced. Separate Kani body checks trust Kani/CBMC, their standard/intrinsic semantics and their pinned Rust compiler; no mechanized cross-tool equivalence is claimed."
limitations = "Twenty-four API mappings are Lean-proved; the other explicitly described scalar/case results are separate Kani body checks. The identity proof for the unsafe method applies only to its AsciiChar implementation, which performs no unsafe cast; it establishes nothing about unchecked conversions from integers or char. The Lean mathematical code-fold is not a proof of the separate case-conversion APIs; those original bodies instead have the separately recorded full-domain Kani checks. General string/input validation, AsciiStr, AsciiString, allocation, serde and arbitrary unsafe conversions remain unproved. Case conversion and printable-picture behavior have separate Kani evidence, not Lean proofs. Invalid enum representations are outside the input domain. The original is_digit_strange_radixes test fails on the pinned modern Rust because char::is_digit panics at radix 0/1; the distinct is_digit API is not covered. Remaining original tests pass with only that test excluded. The five checked scalar conversion bodies and the stated case/character bodies have separate Kani evidence, rather than additional Lean claims. The original new constructor is checked only on ASCII inputs by the generator; its non-ASCII panic domain remains unproved. All-feature/no-default configurations and other targets were not proved."
environment = "Original crates.io ascii 1.1.0 Rust files and Cargo.toml, archive-compared; default features, x86_64-unknown-linux-gnu. The upstream bindings_with_variant_name lint is disabled through RUSTFLAGS and corresponding official rustdoc doctest-build arguments, without source changes. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean 4.35.0. One union extraction supplies all twenty-four API proofs, with full normal/panic radix partitioning in DigitProofs. Panic message payloads are not specified; the generated failure code for the out-of-range branch is assertionFailure. The independent casefold equivalence is checked by Lean kernel reduction over Fin 128 pairs, without native_decide/bv_decide trust. Separate original conversion body checks use Kani 0.68.0, CBMC 6.11.0 and nightly-2026-08-21; source/archive and direct path-dependency provenance are recorded in evidence/kani-conversions."
