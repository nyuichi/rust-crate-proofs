[report]
title = "ASCII classification, string views and sequence updates"
explanation = "For ascii 1.1.0, as_byte returns the exact ASCII code for every valid AsciiChar. The eleven classification methods are correct for all 128 characters: digits are characters '0' through '9'; alphabetic is A-Z or a-z; alphanumeric additionally accepts digits; lowercase and uppercase accept a-z and A-Z respectively; hexdigit accepts 0-9, A-F or a-f. Graphic accepts byte codes 33-126 and printable accepts 32-126. Blank accepts space or tab; whitespace accepts space, tab, LF, CR and FF, rejecting vertical tab; control accepts codes 0-31 or 127. eq_ignore_ascii_case returns exactly whether the two codes are equal after mapping A-Z to a-z and leaving other codes unchanged; the independent mathematical equivalence is proved for all 128 squared valid pairs. For the AsciiChar implementation of ToAsciiChar, the checked method always returns Ok of the same value and the unchecked method returns that same value. is_ascii_punctuation accepts exactly ASCII intervals 33-47, 58-64, 91-96 and 123-126. The hand-written Default implementation returns the NUL enum value. AsAsciiStrError::valid_up_to returns its stored index; this does not establish that a separate validator found the first invalid byte. The public is_alphabetic, is_alphanumeric, is_lowercase and is_uppercase methods satisfy the same letter/digit predicates. is_whitespace accepts space, tab, LF, CR, VT and FF. For every u32 radix, is_digit returns normally at radix 0-36 and accepts exactly characters whose digit value (0-9 or case-independent A-Z values 10-35) is below the radix; other characters return false. Thus radix 0 always returns false and radix 1 accepts only character '0'. Every radix above 36 panics. The other twenty-three character/error bodies terminate normally in the model. AsciiStr::as_slice preserves the complete character sequence; as_mut_slice supplies that initial view and its generated backward function writes every valid same-length replacement back exactly. AsciiStr::len gives the exact sequence length and is_empty is equivalent to an empty sequence. For an already valid AsciiStr receiver, the AsAsciiStr checked conversion returns Ok with the unchanged view, its unchecked conversion is the same view, and the AsMutAsciiStr unchecked conversion preserves the initial view and exact same-length valid replacement writeback. These original implementations are identities, not raw byte casts or validation of other input types. AsciiString::new produces an empty sequence, len returns its exact length, and is_empty is equivalent to an empty sequence. push writes back the original sequence followed by the supplied character below the model length limit; at model length usizeMAX it fails with maximumSizeExceeded. Separately, Kani directly checked the original checked ToAsciiChar bodies for u8, i8, u16, u32 and char over their complete type domains: Ok exactly for ASCII-range inputs, preserving the codepoint, and Err otherwise. Those five body-check results are separate evidence and are not additional Lean API claims. Seven separate Kani checks also verify original case conversion and mutable writeback, as_char, case-insensitive equality and printable control pictures over all 128 valid characters (all pairs for equality). These establish A-Z/a-z mapping, exact receiver updates, ASCII code preservation and U+2400 control pictures with DEL at U+2421. For every FromAsciiError<O> with arbitrary owner type O, ascii_error returns exactly its stored AsAsciiStrError and into_source consumes the wrapper and returns exactly its stored original owner. Both terminate normally with no Clone/Copy requirement on O and no validation or conversion. The stored error index is merely projected; these methods do not establish that a separate validator found an invalid byte. For the original default-allocator Vec<AsciiChar> implementations, From<Vec<AsciiChar>> for AsciiString, From<AsciiString> for Vec<AsciiChar>, and both IntoAsciiString methods preserve every character, its order and the sequence length in the official Vec model. The checked method returns Ok for every valid typed ASCII vector. The unchecked method returns the same wrapped vector for this exact implementation; its elements must already be valid AsciiChar values and it performs no raw-byte reinterpretation. These results do not validate Vec<u8> or describe physical allocation addresses, capacity or allocator failure behavior. Five further exact borrowing implementations are covered: AsRef<[AsciiChar]> and AsMut<[AsciiChar]> for AsciiStr and AsciiString preserve the complete initial character sequence and length; each mutable backward function writes every valid same-length replacement back exactly. AsRef<AsciiStr> for AsciiStr returns the unchanged typed view. These claims concern valid typed receivers and the modeled sequence, not physical buffer identity. Three further exact original methods are covered: AsMut<AsciiStr> for AsciiStr returns its unchanged typed view and identity backward function, so valid same-length replacements are written back exactly. ToAsciiCharError Error::description returns exactly \"not an ASCII character\" and AsAsciiStrError Error::description returns exactly \"one or more bytes are not ASCII\", for every error value. These descriptions do not validate the stored error or describe formatting behavior. The generic AsciiChar::from_ascii<C:ToAsciiChar> method exactly forwards the supplied checked callback result, preserving normal Ok/Err and modeled failure or divergence. It does not independently establish validation or termination of arbitrary callback implementations. For original FromAsciiError<O> Error::description (Rust O:Any), every owner and stored error index returns normally with the same exact constant one or more bytes are not ASCII, without inspecting or converting the owner. Separately, original-Rust Kani checks establish thirty additional scalar contracts: conversion of every valid AsciiChar to u8 or char preserves its code; equality and partial ordering against every u8 and every valid Unicode char agree with numeric code comparison in both directions, including inherited ne/lt/le/gt/ge on those manual implementations. Five further unsafe ToAsciiChar conversions for u8, i8, u16, u32 and char return the exact valid character for every documented safe input code 0..127. These thirty-five contracts are supplemental Kani evidence, not additional Lean API mappings."
trusted_assumptions = "Borrowed slice contracts use the generated value and backward-function semantics. They do not independently establish Rust pointer identity, lifetime or aliasing rules, and no resizing through a mutable slice is claimed. The Rust compiler, official Charon/Aeneas translation, standard-library scalar models and Lean kernel are trusted. Proofs split the complete finite AsciiChar type and use kernel-checked logical reduction and proved scalar arithmetic, without native-evaluation trust. The byte-code table contains each actual ASCII variant in code order. Transitive axioms are limited to propext, Classical.choice and Quot.sound; no custom models or local axioms are introduced. Separate Kani body checks trust Kani/CBMC, their standard/intrinsic semantics and their pinned Rust compiler; no mechanized cross-tool equivalence is claimed. Vector guarantees use the official Vec model of an element sequence and a usize length bound; it contains no allocator, capacity or allocation-address state. Normal-result equalities are established in that abstraction for valid model inputs. The four inspected typed-vector Rust bodies only wrap or move the stored vector; these results are not a general allocator/OOM or Rust memory-safety proof. Generic delegation additionally assumes the supplied Lean trait dictionary corresponds to the Rust implementation. Rust Drop/destructor behavior, captured or external effects and callback termination are not established by the forwarding equation."
limitations = "Fifty-one API mappings are Lean-proved; the other explicitly described scalar/case results are separate Kani body checks. The unsafe identity results cover only ToAsciiChar for AsciiChar, AsAsciiStr/AsMutAsciiStr for an existing AsciiStr, and IntoAsciiString for the original default-allocator Vec<AsciiChar>. Inputs must already be valid Rust values of those exact types. Those identity proofs do not cover unchecked scalar conversions; the separate five Kani scalar contracts cover only the documented 0..127 safety domain. They do not cover unchecked byte slices, str, Vec<u8> or other implementations, and do not independently establish general pointer, lifetime or allocator safety. The Lean mathematical code-fold is not a proof of the separate case-conversion APIs; those original bodies instead have the separately recorded full-domain Kani checks. General input validation, the remaining AsciiStr/AsciiString APIs, allocation, serde and arbitrary unsafe conversions remain unproved. The official Vec model stores only element sequences and a length bound. It does not represent capacity, Rust isizeMAX allocation limits, allocator availability, OS failure or OOM. Thus the push result and failure partition are properties of that model; no exact physical allocation/panic behavior or capacity preservation is claimed. Case conversion and printable-picture behavior have separate Kani evidence, not Lean proofs. Invalid enum representations are outside the input domain. The original is_digit_strange_radixes test fails on the pinned modern Rust because char::is_digit panics at radix 0/1; the crate is_digit API is covered separately for all radix values; the failed test comparison invokes std char::is_digit at radix 0/1. Remaining original tests pass with only that test excluded. The five checked scalar conversion bodies and the stated case/character bodies have separate Kani evidence, rather than additional Lean claims. The original AsciiChar::new constructor is checked only on ASCII inputs by the generator; its non-ASCII panic domain remains unproved. All-feature/no-default configurations and other targets were not proved. The four typed-vector claims exclude Vec<u8>, other Vec element/allocator types and all other From/IntoAsciiString implementations. Vector length and element contents are represented, while capacity, allocation addresses and physical allocation behavior are not. These results establish no guarantee for the distinct Vec<u8> implementations or other element types. The generic from_ascii delegation does not independently prove any arbitrary ToAsciiChar implementation validates or terminates. The generic Error description constant does not validate its stored index or owner. The new scalar Kani dependency copies contain archive-identical runtime src9 and Cargo.toml, but omit archive-root tests.rs; crate tests were not run for these supplemental checks. Full package restoration and general unsafe-call safety outside the documented domain are not claimed."
environment = "Original crates.io ascii 1.1.0 Rust files and Cargo.toml, archive-compared; default features, x86_64-unknown-linux-gnu. The upstream bindings_with_variant_name lint is disabled through RUSTFLAGS and corresponding official rustdoc doctest-build arguments, without source changes. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean 4.35.0. One union extraction supplies all fifty-one API proofs, with full normal/panic radix partitioning in DigitProofs. Panic message payloads are not specified; the generated failure code for the out-of-range branch is assertionFailure. The independent casefold equivalence is checked by Lean kernel reduction over Fin 128 pairs, without native_decide/bv_decide trust. Separate original conversion body checks use Kani 0.68.0, CBMC 6.11.0 and nightly-2026-08-21; source/archive and direct path-dependency provenance are recorded in evidence/kani-conversions. Supplemental scalar30 and unchecked5 evidence is preserved under evidence/kani-scalar35 with immutable producer manifests, raw successful logs and independent reviews; it uses the same Kani 0.68/CBMC 6.11/nightly-2026-08-21 default x86_64 configuration."
