[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "AsciiChar::is_ascii_blank"
module = "Proofs"
theorem = "Proofs.is_ascii_blank_spec"
