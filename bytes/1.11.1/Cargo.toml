[package]
edition = "2021"
rust-version = "1.57"
name = "bytes"
version = "1.11.1"
authors = [
    "Carl Lerche <me@carllerche.com>",
    "Sean McArthur <sean@seanmonstar.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Types and traits for working with bytes"
readme = "README.md"
keywords = [
    "buffers",
    "zero-copy",
    "io",
]
categories = [
    "network-programming",
    "data-structures",
]
license = "MIT"
repository = "https://github.com/tokio-rs/bytes"

[features]
default = ["std"]
alloc = ["creusot-std/alloc"]
std = ["alloc", "creusot-std/std"]

[lib]
name = "bytes"
path = "src/lib.rs"

[dependencies.extra-platforms]
version = "1.3"
features = ["require-cas"]
optional = true
default-features = false
package = "portable-atomic"

[dependencies.serde]
version = "1.0.60"
features = ["alloc"]
optional = true
default-features = false

[dependencies.creusot-std]
version = "=0.13.0"
default-features = false

[target."cfg(loom)".dev-dependencies.loom]
version = "0.7"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(loom)"]
