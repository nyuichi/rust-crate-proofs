[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "Rand32::rand_u32"
module = "Proofs"
theorem = "Proofs.rand_u32_spec"
precondition = "Any u64 internal state and increment, including even increments."

[report]
title = "Exact next-word output and state update in Rand32"
explanation = "For the unchanged Rand32::rand_u32 body, every u64 state s and increment i returns the PCG-XSH-RR output rotate_right(low32(((s >> 18) XOR s) >> 27), low32(s >> 59)), and updates the state to (6364136223846793005*s+i) modulo 2^64 while preserving the increment. Right shifts are logical. The call terminates without model failure. Original crate Rust source and Cargo manifest are unchanged; official Aeneas scalar and array primitives supply all library operations, without custom external models."
trusted_assumptions = "The Rust compiler, Charon/Aeneas translation, official Aeneas scalar/array models and Lean kernel are trusted. Standard-library operator implementations are modeled by the official Aeneas library, rather than individually body-proved. The public theorem has no extra local axioms; transitive dependencies allow only propext, Classical.choice and Quot.sound."
limitations = "Only Rand32::rand_u32 is verified, for the default feature configuration on x86_64-unknown-linux-gnu. Seed constructors, state access/restoration, other generators, signed/floating/ranged output, advancement, buffer filling, serialization and inherited wrappers are outside this proof. No period, distribution, independence, nonzero-state invariant or cryptographic property is established."
environment = "Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Targeted original-body extraction via official --start-from. Source/archive hashes, regenerated translation comparison, tests and transitive axiom audit are retained in evidence."
