[report]
title = "Integer state transitions and exact range traces with float supplements"
explanation = "For oorandom 11.1.5, twelve original integer/state APIs have exact value/state proofs for every scalar input, including zero states and even restored increments. For both Rand32 and Rand64, new_inc sets increment to ((input_increment << 1) OR 1), advances from zero, adds the seed with wrapping arithmetic, then advances again; new uses DEFAULT_INC. state and from_state preserve the complete state/increment pair, with save/restore identity. Unsigned generation returns the specified PCG-XSH-RR permutation of the old state and advances to multiplier*state+increment modulo the state width. Signed generation returns the same output bits interpreted as i32/i64 and preserves that updated state. These calls terminate normally in the extracted model.\n\nSeparate Kani results cover both original rand_float methods for every complete state/increment pair. They return exactly n/2^24 or n/2^53, where n is the top24 or53 bits of the corresponding unsigned word, with the exact independent IEEE encoding and a value in [0,1). Their complete poststate equals an actual unsigned-word call. This follows from successful original-float/helper and all-word/helper specifications on the identical Rust helper; a direct Rand32 check independently confirms the same contract. State equality alone is not a call-count proof; original source/LLBC observations separately identify the sole word call.\n\nBoth original rand_range methods now have exact trace contracts in the extracted debug model. For valid width=end-start, each candidate consumes the next actual PCG word and advances the actual generator. If candidate n is accepted and every earlier candidate rejects against the proved canonical threshold, sampling returns exactly floor(product_n/2^b)+start and the candidate state after n+1 words, where b is32 or64. If every candidate rejects, it diverges. The classical first-accepted-or-all-rejected case split is exhaustive, not an executable termination decision. The specification\u2019s auxiliary typed width must equal end.val-start.val. Invalid start>=end ranges produce assertion failure. Prior no-failure/normal-return bounds/increment preservation and the publicly restored(0,0) range0..3 divergence result remain included; constructor reachability of that pair is not claimed.\n\nAdditional Kani checks establish From<Self>, Borrow<Self> and BorrowMut<Self> identity and mutable replacement propagation for every public state/inc pair; Any matches its own TypeId and distinguishes Rand32 from Rand64 without changing state. CloneToUninit preserves the source and copies its complete state into a distinct valid aligned MaybeUninit stack slot.\n\nSix generic conversion families have conditional original-body Lean contracts: Into delegates to From; TryInto forwards the complete TryFrom result; blanket TryFrom delegates to Into and wraps a normal result in Ok. Modeled failure/divergence propagate. These require the actual Rust trait bounds and matching dictionaries, not arbitrary conversion correctness or termination. TryFrom uses official generation; the four Into/TryInto owner specializations additionally use a separately pinned finite export-only translator patch, with the trust boundary below."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, official scalar models and Lean kernel are trusted. Wrapping, casts, shifts and rotations in the primary proofs use official models, not Rust std body proofs. Range proofs instead include the original std wrapping_neg bodies transparently, with no new provider or model. Lean dependency audits permit only propext, Classical.choice and Quot.sound.\n\nThe four supplemental Into/TryInto body specializations additionally trust a default-off finite export patch that emits exactly the original transparent core bodies and omits duplicate rust_fun registrations. It changes no body, type, callback or Std model. Original source/LLBC, patch/binary hashes, default-off comparison and enabled export guards are retained; no general translator equivalence is established.\n\nKani results trust Kani/CBMC, the pinned August Rust compiler and solver semantics. Float composition uses the identical Rust helper across two universal specifications; no general Aeneas floating-point model or mechanized cross-tool equivalence is asserted. Exact compiler-commit standard sources show Any uses a TypeId intrinsic. Sized CloneToUninit has a clone/write default and a TrivialClone nonoverlapping-copy specialization, which may apply to these Clone+Copy types; the fixed-slot result does not prove arbitrary pointer validity or a particular dispatch route."
limitations = "Twenty machine-readable claims cover fourteen original local APIs and six conditional external core conversion families. These six are not local declarations. Kani results remain separate supplements; this is not full crate completion. All apply only in their recorded target/configuration and tool boundaries.\n\nRange proofs identify the exact sample and final state conditional on a finite first accepted candidate, and divergence for an all-rejected trace. They do not establish an accepted index exists for every state/range, general termination, uniformity, period or expected runtime. Debug assertion failure does not specify release behavior or Rust panic/unwinding effects. Save/restore is pure state identity, not a guarantee about arbitrary callbacks or destructors. No period, distribution, independence or cryptographic guarantee is established.\n\nThe external Kani checks do not prove global TypeId uniqueness, arbitrary CloneToUninit destinations or heap behavior: extent, alignment, nonoverlap and provenance obligations remain with the caller. Generic conversion contracts require actual trait instances and matching modeled dictionaries, preserve the selected associated error type, and do not establish arbitrary U has an instance. Callback correctness/termination, Drop/unwind/global effects, physical aliasing/layout, resource availability and const evaluation remain outside those contracts. The six generic families use a finite compiler-owned source/body binding; arbitrary trait instances, implementations or configurations are not inferred.\n\nEarlier direct combined float attempts timed out and are retained. The later Rand32 direct Z3 check succeeds; Rand64 direct Z3 still times out, while its successful two-stage composition establishes the stated contract. Other targets/configurations were not checked."
environment = "Original crates.io oorandom 11.1.5 src/Cargo.toml, archive-compared without changes. Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official targeted extraction selects all twelve original bodies and their shared callees. Original tests, regeneration hashes and integrated Lean/axiom audits are retained in evidence. Separate Kani0.68/nightly2026-08-21: floatA32/A64Z3 each66checks0fail and allwordB32/B64 each11checks0fail, with immutable COMPOSITION/source-normalization evidence; external6 twojobs34each and external4 Any39each/CloneToUninit42each. Exact std08 source followup and old timeout/review records retained. Supplemental packaging relocates an original dependency or changes a manifest path only and is not a new solver run. Direct Rand32 Z3 reinforcement72checks/0fail; direct Rand64 alternative60s timeout retained, no further retry. Partial original range supplement in evidence/range-established and proofs/EstablishedRange: official nonmonomorphic extraction, original wrapping_neg2 included transparently, opaque0/provider0/newmodels0. Original frozen packet preserved; official-subdir output and import-only proof adaptation recorded. Supplemental libraries imported with the12 primary proofs. The stronger44-file range-partial freeze supersedes the minimum38-file supplemental theorem while preserving it as history;15 source modules are compiled together with the original12 proof module. Conditional generic6 packet: two official TryFrom bodies plus four finite-export Into/TryInto owner specializations,28 named theorems/helpers coimported with standard axioms; patch963996393e9f9c67106e2dd64a9cc2a4fb48f9ec06f5aeb127c568f6a79defd1/rawbinary96e2e328ec0b5a2e53599474ded998b450311f5d4fdf828b39b422885b03bb9b, reproducible snapshot in evidence/conditional-generic6. The six generic external families use finite compiler-owned source/body observations, giving twenty machine contracts under the stated bounds and trust conditions. Exact-range trace final116-file freeze2421cdf9e13e06519d1d45995d3bff786b96ecbd298b12e1dac9747f58c789f7 independently reviewed;22 bounded module jobs/rawlogs have63 unique audited declarations in aggregate, not63 from one finalcoimport. ExactRange2 map to original public bodies through the ordinary source scanner; sourcevalidation and old12 retention are separately recorded."
