[report]
title = "Exact integer generation, seed initialization and state restoration in Rand32 and Rand64"
explanation = "For oorandom 11.1.5, twelve unchanged APIs have exact value/state proofs: new, new_inc, state, from_state, the unsigned output method and the signed output method for both Rand32 and Rand64. For arbitrary seed and increment input, new_inc normalizes the stream to ((increment << 1) OR 1), starts at zero, performs one PCG state update, adds the seed modulo the state width, then performs a second PCG state update. new uses the published DEFAULT_INC. state returns the exact current state and increment, and from_state restores those values unchanged; two additional composition theorems establish save/restore identity. Unsigned generation returns the exact PCG-XSH-RR output permutation of the old state and advances to multiplier*state+increment modulo 2^64 or 2^128. Signed generation preserves that updated state and reinterprets the unsigned result bits as i32 or i64. Each covered call terminates normally in the Aeneas model for every scalar input, including zero states and even restored increments. Separate Kani results establish both original rand_float methods for every complete state/increment pair. They return exactly n/2^24 for Rand32 and n/2^53 for Rand64, where n is the top24 or53 bits of one actual unsigned word result; the IEEE bits match an independent integer encoding and the value lies in [0,1). Their complete poststate equals that actual word call. This follows by composing an original-float versus same-Rust-helper relation with an all-word helper versus independent IEEE relation; the helper source hash and normalization tokens are fixed. State equality is not a call-count proof; separate source/LLBC observations identify the original sole word call. The earlier range-only checks remain separate evidence. For both generators, further Kani checks cover From<Self>, Borrow<Self> and BorrowMut<Self> for all public state/inc and replacement pairs, including exact mutable replacement propagation. Any::type_id matches its own TypeId and differs between Rand32 and Rand64 while preserving state. CloneToUninit copies the exact state into a distinct valid aligned MaybeUninit stack slot and preserves the source. These are concrete observations, not extra Aeneas machine claims. A direct combined Z3 check independently confirms the same Rand32 float bits/range/poststate contract; it adds no second API or broader domain."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, official Aeneas scalar models and Lean kernel are trusted. No custom external models or local trusted helper contracts are used. All fourteen public and supplementary theorem dependency audits permit only propext, Classical.choice and Quot.sound. Standard-library wrapping, casts, shifts and rotations use official Aeneas models, rather than body proofs of Rust std implementations. Separate Kani results trust Kani/CBMC, the pinned August Rust compiler and solver semantics. Float composition uses the identical Rust helper across its two successful universal checks; no floating-point Aeneas model or cross-tool equivalence is assumed. Exact compiler-commit standard sources show Any uses the TypeId intrinsic. Sized CloneToUninit dispatches through CopySpec: its default writes a clone, while the TrivialClone specialization copies nonoverlapping bytes and may apply to these Clone+Copy types. The fixed-slot check does not prove arbitrary pointer validity or a particular dispatch route."
limitations = "The Aeneas contracts cover twelve integer/state APIs under the stated original default configuration on x86_64. The additional float guarantee is a separate composed Kani result for the pinned target and compiler, not a new Aeneas claim or a general floating-point model. Earlier direct combined float attempts timed out and are retained. The later Rand32 direct Z3 check succeeds; Rand64 direct Z3 still times out, while its successful A/B composition remains the established evidence. Both rand_range methods remain unproved. The external ten checks do not establish global TypeId uniqueness or arbitrary CloneToUninit destinations: valid extent, alignment, nonoverlap and provenance obligations remain with the caller, and only the distinct stack-slot setup was checked. Six generic conditional external conversion families and arbitrary downstream trait implementations remain unproved. Save/restore establishes pure state identity without arbitrary callbacks or destructor effects. No period, distribution, independence or cryptographic guarantee is established. Other targets/configurations were not checked."
environment = "Original crates.io oorandom 11.1.5 src/Cargo.toml, archive-compared without changes. Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official targeted extraction selects all twelve original bodies and their shared callees. Original tests, regeneration hashes and integrated Lean/axiom audits are retained in evidence. Separate Kani0.68/nightly2026-08-21: floatA32/A64Z3 each66checks0fail and allwordB32/B64 each11checks0fail, with immutable COMPOSITION/source-normalization evidence; external6 twojobs34each and external4 Any39each/CloneToUninit42each. Exact std08 source followup and old timeout/review records retained. Supplemental packaging relocates an original dependency or changes a manifest path only and is not a new solver run. Direct Rand32 Z3 reinforcement72checks/0fail; direct Rand64 alternative60s timeout retained, no further retry."
