[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "encoded_len"
module = "Proofs"
theorem = "Proofs.encoded_len_spec"
precondition = "Input length at most usize::MAX / 2; default features, x86_64, debug assertions enabled."

[[tool.proofs]]
api = "decoded_len"
module = "Proofs"
theorem = "Proofs.decoded_len_spec"
precondition = "Every well-typed input slice, regardless of byte contents; default features, x86_64, debug assertions enabled."

[[tool.proofs]]
api = "<core::fmt::Error as From<base16ct::Error>>::from"
module = "Proofs"
theorem = "Proofs.error_to_fmt_spec"
precondition = "Both Error variants; default features on x86_64."

[report]
title = "Base16 length calculations and formatting-error conversion"
explanation = "For base16ct 1.0.0, decoded_len terminates normally for every input slice. It returns Ok of exactly half the input length when that length is even, and Err(InvalidLength) exactly when it is odd. It examines length only, so this result does not validate hexadecimal characters. encoded_len returns exactly twice the input length without a panic when the length is at most usize::MAX / 2. The handwritten From<Error> conversion into core::fmt::Error always returns the formatting error value normally for either source error, intentionally discarding which error occurred. These are body proofs of the unchanged published APIs; the length proofs quantify arbitrary slice lengths representable in the model. Separately, original Error Display formatting under default {} flags and a fixed initialized64-byte writer returns exactly invalid Base16 encoding (23bytes) or invalid Base16 length (21bytes) for the corresponding variant. A writer that rejects the first literal before storing bytes instead propagates fmt::Error and retains its original length and bytes. Both variants and writer modes are symbolic; one Kani harness completes1910checks with no failures. Additional original-code Kani checks cover lower/upper/mixed decode for every2-byte input and every initial3-byte destination: success occurs exactly for the accepted alphabet, returns exactly1decoded byte, and preserves destination bytes1and2; invalid input returns InvalidEncoding while byte0 is not specified. Lower/upper encode checks cover every1-byte input and initial4-byte destination, return its exact canonical2ASCII bytes, preserve bytes2and3 and roundtrip through the actual decoder. Separate original-Rust Kani checks cover actual core::error::Error source, cause and description defaults for both valid base16ct Error variants. source and cause return None; description returns exactly the literal description() is deprecated; use Display. The local Error implementation is empty, so these are three external provided defaults, not three new local bodies. All58 checks pass and no primary mapping is added. A separate kernel-checked supplement covers the public HexDisplay tuple constructor and its public .0 field projection for every represented byte slice. Construction stores the complete slice view; projection returns that same logical view, preserving every modeled byte and length. Three transparent-driver theorems cover constructor, projection and their roundtrip. These are two public data operations, not extra exported functions or new API-card claims."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, standard-library slice/scalar models and Lean kernel are trusted. The proofs add no local axioms or custom standard-library models. Transitive theorem dependencies use only propext, Classical.choice and Quot.sound. These Error-default checks trust the exact packaged Kani0.68/CBMC6.11/Z3, Rust nightly2026-08-21 and compiled core/std binaries whose hashes are retained. Raw source for that packaged August std was not available and is not claimed independently reconstructed; September source is not substituted for it. The HexDisplay supplement uses the same official pinned Rust/Charon/Aeneas toolchain and existing slice value model, with no new model or generated-source changes. Its three audited theorems require only propext and Quot.sound. The Rust compiler checks the original borrowed signatures; the Lean result concerns represented slice values. The verification driver functions are entry points for data-operation proofs, not additional base16ct exports."
limitations = "The registered Aeneas mappings cover only decoded_len, encoded_len and From<Error> for core::fmt::Error; general Display formatting is not proved. General-length hexadecimal encoding, decoding, character validation, destination writes, allocation and encode_str's unchecked UTF-8 conversion are not verified. encoded_len behavior above usize::MAX / 2 is outside the proved precondition. Other targets, feature configurations and release overflow behavior were not checked. The separate Display supplement covers only default formatting and this fixed writer, not arbitrary format flags/writers, partial-prefix error policies, other targets or feature configurations. It adds no Aeneas mapping. Encoded-length overflow remains outside the existing precondition. These five codec checks cover only source/destination lengths2/3 for decode and1/4 for encode, with independent1-byte roundtrip decode destinations. They do not prove arbitrary lengths/capacities, general failure-side prefix contents, encode_str UTF8 conversion, allocation or encoded_len overflow. Ordinary Kani supplements add no Aeneas mappings. The Error-default results cover exactly both valid fieldless base16ct Error variants under default x86_64 configuration. They do not verify arbitrary Error implementations, formatting, other configurations/targets or independent std-source/compiler correctness. Deprecated cause/description remain public operations tested directly. The existing decoded_len/encoded_len/foreign-self From mapping, Display1910 and bounded codec1484 evidence remain unchanged; encoded_len above usizeMAX/2 remains unproved. The HexDisplay constructor/projection result establishes logical byte-slice content and length preservation only. It does not establish formatting/encoding/decoding, physical address or pointer identity, arbitrary aliasing/heap behavior, lifetime soundness or general Rust memory safety. Existing Display1910, codec1484 and Error58 protocols retain their separate conditions and compiler boundaries; none is strengthened into an arbitrary backend or formatting theorem by this data-operation result. Primary3 and all existing preconditions remain unchanged."
environment = "Original crates.io base16ct 1.0.0 source files and Cargo.toml, byte-compared against the archived release; default features, debug assertions enabled, x86_64-unknown-linux-gnu. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean 4.35.0. Official targeted extraction; no Rust or generated Lean changes. A local cargo-proofs API-discovery patch recognizes the crate-owned Error argument in From<Error> for foreign core::fmt::Error; exact-one API resolution and axiom policy are unchanged. Display supplement: Kani0.68.0/CBMC6.11.0/Rust nightly2026-08-21,1910checks/0fail/125internalunreachable,11harnessproperties/3unsupportedguards,unwind80, archived completed original run independently audited. Metadata erratum corrects prior22/20 literal lengths to actual23/21; source/harness/log unchanged. evidence/kani-display. Additional bounded byte codec evidence:5Kani harnesses/1484checks/0fail, unwind8 assertions enabled, original archive-identical source, nightly2026-08-21/default/x86_64; evidence/kani-byte-codec. evidence/kani-error-defaults3 retains the immutable17-file packet, exact original archive/runtime/Cargo, direct UFCS harnesses, full58check log, unwind80 assertion configuration, compiled Kani standard-library pins and two independent reviews. Newmodels, source adaptation, observers and additional Aeneas mappings are zero."
