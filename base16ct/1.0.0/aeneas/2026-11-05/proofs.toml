[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "encoded_len"
module = "Proofs"
theorem = "Proofs.encoded_len_spec"
precondition = "Input length at most usize::MAX / 2; default features, x86_64, debug assertions enabled."

[[tool.proofs]]
api = "decoded_len"
module = "Proofs"
theorem = "Proofs.decoded_len_spec"
precondition = "Every well-typed input slice, regardless of byte contents; default features, x86_64, debug assertions enabled."

[[tool.proofs]]
api = "<core::fmt::Error as From<base16ct::Error>>::from"
module = "Proofs"
theorem = "Proofs.error_to_fmt_spec"
precondition = "Both Error variants; default features on x86_64."

[report]
title = "Base16 length calculations and formatting-error conversion"
explanation = "For base16ct 1.0.0, decoded_len terminates normally for every input slice. It returns Ok of exactly half the input length when that length is even, and Err(InvalidLength) exactly when it is odd. It examines length only, so this result does not validate hexadecimal characters. encoded_len returns exactly twice the input length without a panic when the length is at most usize::MAX / 2. The handwritten From<Error> conversion into core::fmt::Error always returns the formatting error value normally for either source error, intentionally discarding which error occurred. These are body proofs of the unchanged published APIs; the length proofs quantify arbitrary slice lengths representable in the model. Separately, original Error Display formatting under default {} flags and a fixed initialized64-byte writer returns exactly invalid Base16 encoding (23bytes) or invalid Base16 length (21bytes) for the corresponding variant. A writer that rejects the first literal before storing bytes instead propagates fmt::Error and retains its original length and bytes. Both variants and writer modes are symbolic; one Kani harness completes1910checks with no failures."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, standard-library slice/scalar models and Lean kernel are trusted. The proofs add no local axioms or custom standard-library models. Transitive theorem dependencies use only propext, Classical.choice and Quot.sound."
limitations = "Only decoded_len, encoded_len and From<Error> for core::fmt::Error are covered; general Display formatting is not proved. Hexadecimal encoding, decoding, character validation, destination writes, allocation and encode_str's unchecked UTF-8 conversion are not verified. encoded_len behavior above usize::MAX / 2 is outside the proved precondition. Other targets, feature configurations and release overflow behavior were not checked. The separate Display supplement covers only default formatting and this fixed writer, not arbitrary format flags/writers, partial-prefix error policies, other targets or feature configurations. It adds no Aeneas mapping. Encoded-length overflow remains outside the existing precondition."
environment = "Original crates.io base16ct 1.0.0 source files and Cargo.toml, byte-compared against the archived release; default features, debug assertions enabled, x86_64-unknown-linux-gnu. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean 4.35.0. Official targeted extraction; no Rust or generated Lean changes. A local cargo-proofs API-discovery patch recognizes the crate-owned Error argument in From<Error> for foreign core::fmt::Error; exact-one API resolution and axiom policy are unchanged. Display supplement: Kani0.68.0/CBMC6.11.0/Rust nightly2026-08-21,1910checks/0fail/125internalunreachable,11harnessproperties/3unsupportedguards,unwind80, archived completed original run independently audited. Metadata erratum corrects prior22/20 literal lengths to actual23/21; source/harness/log unchanged. evidence/kani-display."
