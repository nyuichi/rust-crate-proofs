[report]
title = "Exact native outputs and additional 32-bit projections across the xoshiro generator family"
explanation = "For rand_xoshiro 0.8.1, the unchanged native word-generating method of each of its fifteen generators returns Ok of the specified output scrambler and performs the exact documented word-state transition. Coverage includes SplitMix64, both xoroshiro64 variants, all three xoroshiro128 variants, and all three variants of each xoshiro128, xoshiro256 and xoshiro512 family. For 32-bit-word engines the native method is try_next_u32; for 64-bit-word engines it is try_next_u64. SplitMix64::try_next_u32 is also proved independently, including its distinct Mix4 output formula, for sixteen proved API bodies. Each theorem covers arbitrary internal words, including all-zero states, and establishes normal termination in the Aeneas model. Array-state representation theorems establish that the four-word and eight-word inputs cover every valid fixed-length engine state. Exact output formulas and resulting fields are defined independently of the generated Rust body in the output*/next* specifications. The selected original bodies have byte-identical official Aeneas translations under the default and serde feature configurations, so these body guarantees apply to both configurations; this does not verify the serde trait implementations. Nine further 32-bit APIs are verified through exact forwarding selectors whose calls to the unchanged original API are inlined by the Rust compiler: all three xoroshiro128, all three xoshiro256 and all three xoshiro512 variants. These establish the same state transition as their 64-bit method, with low 32 output bits for xoroshiro128++ and xoroshiro128**, and high 32 bits for the other seven variants. This yields twenty-five API guarantees: sixteen direct original-body proofs and nine compiler-inlined original-API call proofs. The selector source, typed receiver/return correspondence, target, original method inline scopes and absence of unknown externals are guarded. Default and serde selected programs are byte-identical."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, official Aeneas array/scalar models and Lean kernel are trusted. No custom external models, source adaptations or local helper axioms are used. All API and supplementary direct/selector theorems have dependency audits permitting only propext, Classical.choice and Quot.sound. Standard shifts, rotations, wrapping arithmetic and array operations use official Aeneas models, rather than body proofs of Rust std implementations. The nine selector proofs additionally rely on Rust compiler inlining of the exact original API call; retained MIR scopes identify each original TryRng method and Rng wrapper. The selector does not replace or assume an opaque original API: generated native callees are body-proved and no unknown external definitions remain."
limitations = "Only sixteen native-output bodies and nine compiler-inlined original-API forwarding calls are covered, with default or serde features on x86_64-unknown-linux-gnu. The five 32-bit-engine try_next_u64 compositions, buffer filling, seed construction, state serialization/accessors, jump/long_jump, Seed512 APIs, manual Debug, serde and inherited/default/external blanket methods remain unproved. All-zero states are included in the exact step formulas; seed validity, nonzero-state invariants, full-period behavior, statistical distribution, independence and cryptographic security are not established. Other targets and dependency feature combinations were not checked."
environment = "Original crates.io rand_xoshiro 0.8.1 Rust sources and Cargo.toml, archive-compared unchanged. Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official targeted extraction selects all sixteen original bodies, with macro-expanded transitions. Original tests, regeneration hashes, integrated build and transitive theorem audits are retained in evidence. Separate all-features (serde) extraction is retained in evidence/serde; generated Lean is byte-identical to the default extraction. For the nine selection-only forwarding callers, official Charon optimized MIR with mir-opt-level=4 and +Inline is used, with duplicate-defaulted-methods and remove-unused-self-clauses. Original dependency bodies retain dependency MIR. No original Rust source or Cargo manifest is changed. Path remapping affects provenance spelling only."
