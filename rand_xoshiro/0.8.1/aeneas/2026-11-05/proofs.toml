[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "<rand_xoshiro::Xoshiro128Plus as rand_core::TryRng>::try_next_u32"
module = "Proofs"
theorem = "Proofs.xoshiro_next_spec"
precondition = "Any four u32 internal state words, including all zero; the state is represented by state4."

[report]
title = "Exact next-word output and state update in Xoshiro128Plus"
explanation = "For the unchanged Xoshiro128Plus::try_next_u32 body, every choice of four u32 words (a,b,c,d), including all zero, returns Ok(a+d modulo 2^32). Put c1=c XOR a and d1=d XOR b. The new state is (a XOR d1, b XOR c1, c1 XOR (b << 9), rotate_left(d1,11)), with 32-bit operations. The call terminates without model failure. Original crate Rust source and Cargo manifest are unchanged; official Aeneas scalar and array primitives supply all library operations, without custom external models."
trusted_assumptions = "The Rust compiler, Charon/Aeneas translation, official Aeneas scalar/array models and Lean kernel are trusted. Standard-library operator implementations are modeled by the official Aeneas library, rather than individually body-proved. The public theorem has no extra local axioms; transitive dependencies allow only propext, Classical.choice and Quot.sound."
limitations = "Only Xoshiro128Plus::try_next_u32 is verified, for the default feature configuration on x86_64-unknown-linux-gnu. Seeds, other generators, jumps, u64 output, buffer filling, serde, and inherited wrappers are not verified. No period, distribution, independence, nonzero-state invariant or cryptographic property is established."
environment = "Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Targeted original-body extraction via official --start-from. Source/archive hashes, regenerated translation comparison, tests and transitive axiom audit are retained in evidence."
