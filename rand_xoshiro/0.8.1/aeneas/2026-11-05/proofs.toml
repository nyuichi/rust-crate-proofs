[report]
title = "Exact xoshiro outputs and complete little-endian state serialization"
explanation = "For rand_xoshiro 0.8.1 on x86_64 with default or serde features, 69 scoped contracts specify exact outputs and state updates for every internal word pattern, including zero states. Thirty-five direct original-body contracts cover native outputs, all fifteen little-endian state serializers, and Seed512 zero initialization, byte views, legal fixed-length mutable writeback and iterator initialization. Nine compiler-inlined original calls cover 64-to-32-bit projections: xoroshiro128++ and xoroshiro128** use low output bits; the other seven use high bits. Twenty-five further compiler-inlined calls cover the external rand_core 0.10.1 blanket Rng::next_u32/next_u64 specializations, preserving the exact original forwarding behavior and full resulting state. These are external trait specializations, not local declarations. The original selected translations agree under default and serde features; serde implementations themselves are not proved. Eleven two/four-word serializers use the explicitly bounded U32/U64 primitive layout dictionaries; three eight-word serializers prove termination of the original serialization loop. Separate Kani seed/state/composition results remain supplementary evidence, not additional Aeneas claims. Separately, two original-Rust Kani/Z3 harnesses cover the public Seed512 tuple-constructor operation for every64-byte input. Constructing Seed512(bytes) preserves all64 bytes in its public field and actual AsRef view. For every independent64-byte replacement, copying it through the constructed value's actual AsMut slice writes exactly those bytes back to its public field and AsRef view. These84 successful checks concern a data constructor operation, not a fabricated associated function or a new registered API claim. Existing Default, AsRef, AsMut and iteration mappings are observations/composition here and are not counted again."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, official Aeneas array/scalar models and Lean kernel are trusted. No source adaptations or local helper axioms are used. Eleven newly covered two/four-word state serializers use a custom executable size_of model with explicit layout evidence only for U32=4 and U64=8 bytes. The original generated Types/Funs remain byte-for-byte official outputs. The Lean evidence class is open; this packet supplies exactly these two primitive instances and guards all eleven generated calls and their frozen elaborated instance bindings. Bool and array types have no supplied evidence and are rejected. This is not a universal type-layout theorem. The three eight-word serializers do not call size_of. Archived independent Kani layout checks confirm the Rust u32/u64 sizes under nightly-2026-08-21; Aeneas extraction uses nightly-2026-09-17. ABI agreement across those compilers and correspondence of Rust layout to the Lean evidence remains an explicit, non-mechanical model bridge. All API and supplementary direct/selector theorems have dependency audits permitting only propext, Classical.choice and Quot.sound. Standard shifts, rotations, wrapping arithmetic and array operations use official Aeneas models, rather than body proofs of Rust std implementations. The nine selector proofs additionally rely on Rust compiler inlining of the exact original API call; retained MIR scopes identify each original TryRng method and Rng wrapper. The selector does not replace or assume an opaque original API: generated native callees are body-proved and no unknown external definitions remain. Seed512 byte-view and iterator initialization proofs use the official array-to-slice and slice-iterator models. The mutable reference model specifies write-back of the fixed-length referent; resizing that referent is not a legal returned-slice operation in safe Rust. The Seed512 constructor supplement separately trusts pinned Kani0.68/CBMC/Z3, its August Rust/compiler memory semantics, exact rand_core0.10.1 and default x86_64 configuration. Enabled unwind70 covers all64-byte comparison/copy loops, without disabled checks, observer, private injection, model or original-source adaptation."
limitations = "The 69 mapped contracts comprise 35 direct bodies and 34 compiler-inlined original calls, including exactly 25 external blanket specializations. The five 32-bit-engine try_next_u64 compositions and corresponding external Rng::next_u64 specializations remain outside these Aeneas claims. Seed construction, buffer filling, jump/long_jump, Debug/formatting, serde implementations and other inherited/default/blanket methods are not completed. Seed512 iterator initialization does not prove iterator operation bodies. Serializer layout dictionaries cover only the frozen U32/U64 use closure; arbitrary type layout is not established. Separate Kani seed/state/composition evidence has its own documented compiler and domain boundaries. No seed reachability, period, distribution, independence or cryptographic property follows from these transition formulas. Other targets and feature/dependency combinations are not covered. The constructor check covers the complete64-byte input and replacement domains under that concrete default configuration. It does not establish arbitrary external aliasing, heap/provenance, physical address identity, serde, manual Debug, other targets/configurations or general Rust memory safety. Constructing this public tuple is a data operation; no additional function/source card is invented, and all69 primary mappings remain unchanged."
environment = "Original crates.io rand_xoshiro 0.8.1 Rust sources and Cargo.toml, archive-compared unchanged. Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official targeted extraction selects all sixteen original bodies, with macro-expanded transitions. Original tests, regeneration hashes, integrated build and transitive theorem audits are retained in evidence. Separate all-features (serde) extraction is retained in evidence/serde; generated Lean is byte-identical to the default extraction. For the nine selection-only forwarding callers, official Charon optimized MIR with mir-opt-level=4 and +Inline is used, with duplicate-defaulted-methods and remove-unused-self-clauses. Original dependency bodies retain dependency MIR. No original Rust source or Cargo manifest is changed. Path remapping affects provenance spelling only. A third official targeted extraction covers the four Seed512 bodies; default and serde generated Types/Funs are byte-identical and have no unknown externals. The additional fifteen-serializer original-root extraction is non-monomorphized, uses the official distinct XoshiroSerializationModel namespace, and has byte-identical default/serde Types/Funs. Fourteen claims are added; existing SplitMix64::state is retained without duplicate registration. Full LLBC traversal and all generated modules restrict custom size_of uses to five U32 and six U64 calls per configuration; the only custom external template declaration is size_of. All six claim modules are simultaneously imported and all theorem dependencies audited. External blanket opt-in: exact25 rand_core0.10.1 specializations, checksum-pinned source closure, CLI-owned independent compiler capture in default and serde configurations; exact singleton observations. CLI032640e536faffa600f4345b14cc51b40d827c322745d286b225858d84612d68. evidence/kani-seed512-constructor retains immutable producer hashes, exact lock, full commands/solver pins, two raw successful logs (33+51=84checks,0failed,4unreachable) and independent review. Cargo.producer.toml preserves the executed dependency location; only the portable manifest path changes to the archive-identical artifact root. This packaging performs no new solver run."

