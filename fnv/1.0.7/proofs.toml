[report]
title = "Creusot verification of fnv 1.0.7 FnvHasher"
explanation = """
Verification of FnvHasher::with_key and the FnvHasher implementations of
Default::default, Hasher::finish, and Hasher::write. The proof checks arithmetic
and indexing safety and exact 64-bit FNV-1a state updates, including XOR and
wrapping multiplication. Constructors and finish have exact state contracts.
Published machine-readable claims are panic_contract only; the functional
postconditions are proof context, not a separate functional-correctness claim.
"""
trusted_assumptions = ""
limitations = """
This recording uses --no-default-features (no_std).
The verification fork replaces the upstream iterator loop with an index-based
while loop and adds ghost annotations; XOR and wrapping multiply are preserved.
"""
environment = """
macOS aarch64; Rust nightly-2026-06-22 (rustc 91fe22da8).
Creusot 0.13.0, upstream v0.13.0 commit 318615be3b8bbc60d1f6d52469ba5c0bdebed4f1;
crates.io creusot-std =0.13.0. Why3 54c92f96bb0711d6e991c18f10bfbc08d90d028b;
why3find eab37557d3e24e1913a3c4f44bc5528ef497c6c9; Z3 4.16.0 and CVC5 1.3.1.
Native why3find proof.json sessions, with proof cache disabled.
"""

[tool]
name = "creusot"
version = "0.13.0"
target = "annotated"
