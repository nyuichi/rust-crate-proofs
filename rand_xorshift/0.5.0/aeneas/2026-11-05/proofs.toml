[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "<rand_xorshift::XorShiftRng as rand_core::TryRng>::try_next_u32"
module = "Proofs"
theorem = "Proofs.try_next_u32_spec"
precondition = "Any four-u32 internal state, including all zero; three explicit std Wrapping operator models are used and independently checked with Kani."

[report]
title = "Exact next-word output and state update in XorShiftRng"
explanation = "For rand_xorshift 0.5.0's unchanged try_next_u32 body, the Aeneas proof establishes the exact next word and state for every four-u32 internal state, using three explicit standard-library wrapping-operator models. With t = x XOR (x << 11), the returned word is r = w XOR (w >> 19) XOR t XOR (t >> 8), with 32-bit operations and logical right shifts. The state becomes (y, z, w, r), and the call returns Ok without model failure or divergence. Kani additionally checks the actual original Rust body against this formula for all four-word states, and checks the Rust std wrapping operators against the corresponding primitive formulas. No crate-source adaptation or frontend patch is used."
trusted_assumptions = "The Rust compiler, Charon/Aeneas translation, existing Aeneas scalar primitives, Lean kernel, and Kani/CBMC toolchains are trusted. Three executable std Wrapping<u32> models connect shift-left, shift-right, and xor to existing Aeneas primitives. Kani checks their Rust correspondence for all u32 operands and all 64-bit usize shift amounts; the relation between these Rust formulas and the Lean definitions remains an explicitly reviewed semantic bridge, not an in-Lean proof of the std bodies. No extra local axiom occurs in the public theorem's transitive dependencies."
limitations = "The result covers only try_next_u32 on x86_64-unknown-linux-gnu without serde. Seed construction, next_u64, fill_bytes, external-RNG initialization, formatting, inherited Rng wrappers, and serde are not verified. The all-zero state is included; no seed invariant, nonzero-state invariant, period, distribution, or cryptographic property is established. The three standard-operator models are executable definitions with Kani correspondence evidence, rather than body-proved translations of the original std implementations. Kani uses a different Rust nightly from extraction, so its correspondence checks are not direct proofs of that extraction toolchain's std bodies."
environment = "Original crates.io rand_xorshift 0.5.0; Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official start-from and split-files options select the original body and three external operators. Kani 0.68.0 / CBMC 6.11.0 / Rust nightly-2026-08-21 verify two supplementary harnesses: 10 and 107 checks, no failures. The Lean theorem audit allows only propext, Classical.choice, and Quot.sound. cargo-proofs 0.4.1 uses the documented CA-trust and upstream audit-variable compatibility fixes without changing the allowed-axiom policy."
