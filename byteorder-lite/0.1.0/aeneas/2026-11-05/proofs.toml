[report]
title = "Fixed and variable-width integer writes, with exact failure conditions"
explanation = "For byteorder-lite 0.1.0, the original BigEndian and LittleEndian write_u16/u32/u64/u128 and write_i16/i32/i64/i128 bodies write the specified endian bytes into the beginning of every sufficiently long output slice. All remaining bytes are preserved. A shorter output slice triggers the slice bounds panic before any write. The handwritten BigEndian::default and LittleEndian::default implementations always trigger an explicit panic; their empty enum types cannot be constructed by these methods. Signed integers serialize their unchanged two's complement bit pattern. Thin selector wrappers only select original dependency call roots; the theorems apply directly to those extracted original bodies. The four variable-width unsigned writes additionally output the selected least-significant bytes in the requested endian order. Their required-byte guard is 8 or 16 minus the leading-zero count of (n OR 1) divided by 8; success requires that count no greater than nbytes, nbytes no greater than the word width in bytes, and enough buffer space. A failed guard triggers assertionFailure. The proofs quantify over arbitrary input integers and arbitrary output contents and establish normal return when the output buffer is sufficiently long, and a panic result otherwise."
limitations = "This report covers twenty integer-write methods and the two handwritten Default methods on x86_64 with default features. It does not establish read methods, other signed and floating-point wrappers, bulk slice operations, I/O extensions, or whole-trait integration. Rust source and package manifest are byte-identical to crates.io. No custom standard-library models or axioms are introduced. Inherited signed methods are specialized with official Charon default-method duplication; manifest guards check that all sixteen original dependency method bodies are non-opaque and traced to archive-identical source."
trusted_assumptions = "The official Aeneas standard-library models and Rust-to-Lean translation are the semantic boundary; Lean checks the stated theorems with only propext, Classical.choice, and Quot.sound."
environment = "Charon 08d7c9d50144bd84848212c24701253585e90d1f; Aeneas be86ab0f1989d04944292b345b24c435be3ad10a; Rust nightly-2026-09-17; Lean 4.35.0; x86_64 default features."
