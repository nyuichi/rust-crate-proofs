[report]
title = "Branch operations, borrowed views and payload factoring in Either"
explanation = "For either 1.19.0 with default features on x86_64, is_left/is_right identify the actual branch; left/right return the corresponding optional payload; left_or/right_or select that payload or the given default; flip swaps the branch and a separate composition theorem proves flipping twice returns the original value. left_and/right_and select the supplied value or preserve the opposite payload. factor_none moves the optional payload outside Either while retaining its tag. factor_first/factor_second move the common tuple component outside Either. as_ref preserves the variant and referenced value; as_mut preserves the initial view and its generated backward function writes a matching-variant replacement payload back to the original variant. The fourteen original bodies terminate normally in the model for all well-typed values in their stated domains."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, standard-library models and Lean kernel are trusted. Transitive theorem axioms are limited to propext, Classical.choice and Quot.sound. No local helper contracts or custom models are assumed. Reference contracts use Aeneas's value and backward-function semantics; they do not independently verify the compiler borrow checker or Rust aliasing model."
limitations = "Only the fourteen named methods and the two-flip composition are proved. Remaining inherent methods, callback-taking APIs, iterators, pinning, standard trait implementations and serde remain unproved. Rust destructor behavior and resource consumption are outside the pure value model. All-feature/no-default configurations and other targets were not proved."
environment = "Original crates.io either 1.19.0 Rust files and Cargo.toml, archive-compared; default features, x86_64-unknown-linux-gnu. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean 4.35.0. The union of the fourteen roots is extracted once into one Generated module and proved in one Proofs module."
