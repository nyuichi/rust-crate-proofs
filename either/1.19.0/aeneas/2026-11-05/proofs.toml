[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "Either::is_left"
module = "Proofs"
theorem = "Proofs.is_left_spec"
precondition = "All well-typed Either<L,R> inputs, for arbitrary payload types and values; default features on x86_64."

[[tool.proofs]]
api = "Either::is_right"
module = "Proofs"
theorem = "Proofs.is_right_spec"
precondition = "All well-typed Either<L,R> inputs, for arbitrary payload types and values; default features on x86_64."

[[tool.proofs]]
api = "Either::left"
module = "Proofs"
theorem = "Proofs.left_spec"
precondition = "All well-typed Either<L,R> inputs, for arbitrary payload types and values; default features on x86_64."

[[tool.proofs]]
api = "Either::right"
module = "Proofs"
theorem = "Proofs.right_spec"
precondition = "All well-typed Either<L,R> inputs, for arbitrary payload types and values; default features on x86_64."

[[tool.proofs]]
api = "Either::flip"
module = "Proofs"
theorem = "Proofs.flip_spec"
precondition = "All well-typed Either<L,R> inputs, for arbitrary payload types and values; default features on x86_64."

[[tool.proofs]]
api = "Either::left_or"
module = "Proofs"
