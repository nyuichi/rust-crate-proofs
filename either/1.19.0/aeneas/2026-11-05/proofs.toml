[report]
title = "Either branch operations, payload conversions and conditional composition"
explanation = "The new manual Iterator::next implementation for Either passes the selected inner iterator state to its next dictionary and returns exactly its Option<Item> with the updated state under the same Either tag. None still retains the returned updated state. Normal item/state helpers assume only the selected inner next result; identical modeled failure/divergence propagate without using the other dictionary. This does not prove arbitrary inner iterator progress, termination, length bounds or fusedness. The new map_either/map_either_with contracts preserve the present variant while replacing its payload with the selected callback result; the context-aware form forwards the original context. Normal results require success only at that actual payload/context, and modeled failure/divergence propagate unchanged. inspect_left/right call the selected borrowed-value callback and return the original modeled self after success; on the other variant they return self without any callback premise. This self-retention is a property of the extracted shared-reference value model and does not certify unchanged observable Rust interior/global state under arbitrary callbacks. For either 1.19.0 with default features on x86_64, the forty-three named APIs have the following value-model contracts. either dispatches only to the callback for the present variant, passing exactly its payload; either_with additionally passes the original context as the first pair element. either_into dispatches that payload to the corresponding Into dictionary. Their main contracts preserve the selected computation's whole modeled Result without assuming success. Separate normal-value contracts need success only at the selected payload/context; failure and divergence helpers retain the same modeled outcome. The unused callback/conversion dictionary is unconstrained. Twelve earlier callback APIs compose a mathematical callback under their explicit normal-result premises for every callback argument, with selected failure propagated and nonselected results preserved. The real impl<T> IntoEither for T dictionary is linked to its original default, so into_either_with requires only normal predicate behavior at the actual borrowed input. Predicates/projections identify and retain the exact variant and optional payload; flip swaps it and flipping twice reconstructs the original. Eager selection preserves the indicated payload or supplied alternative. Optional and tuple factoring preserve tags and exact components. as_ref preserves the borrowed view; as_mut's backward function writes a matching-variant replacement payload back. The original handwritten conversions map Result Ok to Right and Err to Left, with exact payloads, and reverse those mappings; both roundtrips reconstruct every variant. left_or_default/right_or_default preserve the matching payload without a Default premise and otherwise delegate the Default computation's entire modeled outcome. Normal fallback values, modeled failure and divergence have separate explicit premises. The earlier thirty APIs return normally in this model under their stated conditions; the Default fallback pair and the three dispatch APIs retain abstract selected-computation outcomes. These are value-semantic guarantees with the destructor and callback boundaries stated below. Separate supplemental Lean proofs cover the original shared-reference and mutable-reference specialized copied/cloned methods. copied preserves the selected branch and payload; mutable copied also preserves both extracted backward-state values. cloned delegates exactly to the selected Clone dictionary, preserving its modeled Result including failure/divergence, and wraps a successful clone in the same branch. Mutable cloned additionally preserves the two extracted backward-model values. These four specialized Rust methods are not registered machine claims because source-scanner specialized-owner matching remains blocked; the existing40 mappings remain unchanged. The original DoubleEndedIterator::next_back method exactly delegates to the selected inner dictionary, returning its Option and updated state in the same Either branch and preserving modeled failure or divergence. This contract imposes no independent iterator correctness or termination law. Two additional original conversions delegate to only the selected IntoIterator dictionary. factor_into_iter permits distinct left/right Item types and wraps the returned iterator in the original IterEither; into_iter requires equal Item types while allowing distinct IntoIter types and wraps directly in the same Either branch. The exact equations preserve all modeled Result outcomes, including callback failure/divergence and modeled visible effects. These contracts do not verify operations of the produced iterator or arbitrary callback behavior."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, standard-library value models and Lean kernel are trusted. Transitive theorem axioms are restricted to propext, Classical.choice and Quot.sound. No additional axioms or custom models are used. Generic FnOnce, Into and Default computations are explicit dictionary parameters; their concrete implementations and effects are not independently verified here. Reference contracts use Aeneas's value/backward-function semantics and do not independently prove the Rust borrow checker or aliasing model. The reference4 supplement uses the same official pinned translation with a separate official namespace. Its six theorems use only the standard Lean axioms. Clone dictionary correspondence is conditional; no law that clone output equals input is assumed."
limitations = "Iterator::next writeback is a value/backward-state model guarantee under the supplied inner next dictionary, not verification of that concrete iterator or all Rust memory/external effects. No size_hint/len/count, finite-length or fused-iterator guarantee is added. For inspect_left/right, returning self in the extracted model must not be read as proving that callbacks cannot mutate interior/global state or that physical Rust payloads stay observationally unchanged. Only the forty-three mapped callables and their stated composition helpers are verified, not every public API. The new dispatch contracts establish branch/payload/context forwarding and modeled Result delegation, not arbitrary callback or Into correctness, success, termination, panic freedom or captured-state effects. Their normal-value theorems assume the selected call succeeds at that argument. No arbitrary mutable-context writeback or eager argument-construction claim is added. Rust Drop for discarded callbacks/payloads can panic, diverge or affect global state; destructor execution, unwind/return ordering, resource consumption and external effects are outside the value model. Modeled fail/div propagation is not a specification of every Rust panic payload or unwinding behavior. Default implementation values/termination/effects remain unverified. IntoEither uses the actual blanket dispatch, but its predicate/reference semantics retain the stated model boundary. Other inherent methods, iterator and pinning APIs, most trait/blanket implementations and serde remain unproved. into_inner still fails the untouched generated Lean do-match elaborator for the repeated T parameter; factor_ok/factor_err remain blocked by their current extraction/model limitations. All-feature/no-default configurations and other targets are not proved. The four reference-method results are supplementary model proofs only; ambiguous nominal source keys are not substituted for exact shared/mutable receiver identities. They do not guarantee arbitrary Clone correctness or termination, interior/global state preservation, Drop/panic/unwinding, external effects or physical aliasing/lifetimes. Backward-value equalities are not independent Rust memory proofs. The supplemental model and primary model are compiled in separate Lean module environments because their generated global discriminant-instance names collide on simultaneous import; no simultaneous model-equivalence bridge is claimed. The primary mappings now number43; next_back retains the selected dictionary and value-model assumptions, without arbitrary iterator termination, Drop/panic/unwinding, interior/global effect or independent memory guarantees. The two conversion contracts do not establish Iterator laws, callback correctness/termination, concrete iterator next/size_hint behavior, arbitrary Rust Drop/interior-mutability/global effects or independent heap/alias/provenance. The normal result depends only on the selected IntoIterator callback returning that value. IterEither operations with unresolved extraction assumptions are not verified by constructing the wrapper."
environment = "Original crates.io either 1.19.0 Rust and Cargo.toml, archive-compared; default features on x86_64-unknown-linux-gnu. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean 4.35.0. Forty-three callable roots plus one actual blanket-implementation metadata root are extracted together into a single unchanged Generated.Either module; eleven primary proof modules and all forty-three machine claims are jointly imported and audited. Official Charon exclusions omit twelve uncalled core Iterator defaults and official Aeneas trait filtering omits unsupported sibling methods; the original next body is byte-identical before/after filtering. No new standard model is introduced. Supplemental original source/archive/LLBC and six standard-axiom theorem audits are preserved in evidence/reference4. Integration re-generates with the official namespace flag and changes proof imports/namespace qualification only; producer compiled target caches are excluded from the public subset and enumerated separately. The43-primary candidate preserves all old41 mapping fields and nine proof sources, adds FactorProofs/IntoIterProofs, and uses one44-root Generated Either/IterEither environment. All43 primary mappings import together in eleven modules;134 unique primary/helper audits use standard3. The reference4 six-theorem library remains separate and is compiled through the explicit needs leanArts facet; no conflicting shared discriminant environment is claimed."

