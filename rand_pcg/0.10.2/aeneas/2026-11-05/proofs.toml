[report]
title = "Exact PCG state, output and advance for all four generator types"
explanation = "For rand_pcg 0.10.2, the four state getters return their stored word. The three LCG stream getters return increment>>1; from_state preserves its input state and stores increment=(stream<<1) OR 1, discarding the highest stream bit. Their new constructors initialize state=((input_state+increment)*multiplier+increment) with modular arithmetic; the multipliers are 6364136223846793005, 47026247687942121848144207491837523525 and 15750249268501108917 respectively. Mcg128Xsl64::new stores input_state OR 1. Native output proofs retain Lcg64Xsh32::try_next_u32 and both word widths for the three 128-bit types. The XSL-RR variants permute the newly advanced state; CM-DXSM permutes the old state then advances. Their 32-bit methods return the low 32 bits of the 64-bit result with the same final state. Original Result::map and conversion closures are body-extracted. Mcg128Xsl64::advance additionally terminates normally for every u128 delta and every internal u128 state, returning state=M^delta*initial_state modulo 2^128, M=47026247687942121848144207491837523525. A well-founded halving-loop proof connects the original body to this ordinary power specification, covering all deltas without an artificial execution bound. These twenty-five direct original-body API guarantees apply under default and serde because the selected official translations are byte-identical; the serde implementations themselves remain unproved. Each of the three LCG advance methods also terminates normally for every full-width delta, state and increment, preserving the stored increment and producing exactly delta repetitions of the ordinary modular affine step x\u21a6M*x+increment. An independent linear recurrence specifies this behavior; a generic affine-composition proof connects the original binary algorithm to it. Increments need not be odd for this state-transform identity. Separate Kani evidence calls the unchanged Mcg128Xsl64::from_seed and public state getter for every sixteen-byte seed. Its state equals the independently decoded little-endian u128 seed OR 1 (242 successful checks under each of default and serde). The exact rand_core 0.10.0 and serde 1.0.228 dependency lock is retained. This is a separate Kani body guarantee, not another Aeneas machine claim or a formal cross-tool equivalence proof. Separately, four Kani harnesses call the original manual Debug implementations through all typed inputs of the listed new/from_state/from_seed/seed_from_u64 constructors. Under default formatting and a fixed 64-byte writer that accepts all bytes or rejects the first write, they emit the fixed redacted type-name literal and propagate the writer error. All four baseline rand_core0.10.0 jobs complete with 8925 checks and no failures. For Lcg64Xsh32 with serde, a separate Kani check decodes every 16-byte wire value through a fixed sequence deserializer, including zero and even increments. For successful two-word decoding, public state() equals the first little-endian u64 and stream() equals the second u64 shifted right by one; successful concrete serialization reproduces all sixteen bytes, including the increment low bit, without changing the RNG. Short sequences of length0 or1 return the concrete invalid_length error, and errors at any reached one of five Deserialize callback stages propagate the supplied code."
trusted_assumptions = "The Rust compiler, official Charon/Aeneas translation, official Aeneas scalar models and Lean kernel are trusted. No custom external models, source adaptations or local trusted helper contracts are used. All twenty-one API theorem dependency audits permit only propext, Classical.choice and Quot.sound. Wrapping arithmetic, shifts, casts and rotations use official standard-library models, rather than proofs of Rust std implementation bodies. The original Result::map body is extracted and proved through its actual closure calls, rather than supplied by a custom model. This serde supplement trusts Kani0.68/CBMC and its August Rust compiler with exact rand_core0.10.0/serde1.0.228. Its concrete sequence backend, invalid_length handler and successful serializer define the observed protocol; they do not stand for arbitrary backends."
limitations = "Coverage is the twenty-five named bodies on x86_64 under default or serde. Internal word states include zero/even values that usual seed constructors may not produce, but all are valid Rust scalar data; no seed-reachability claim is made. Stream getter behavior for arbitrary increments is proved, but no save/restore identity is claimed for an arbitrary even increment. Aeneas byte-seed/from_seed/seed_from_u64 contracts, Lcg64Xsh32::try_next_u64, buffer filling, RNG callbacks/forking, manual Debug, serde and inherited/external blanket APIs remain outside these Aeneas claims. No period, jump-back interpretation for wrapped negative strides, statistical quality or cryptographic security is established. Other targets and dependency feature combinations were not checked. The Debug supplement is limited to the listed constructor-input families, default formatting and the fixed writer behavior; it does not establish arbitrary internal-state provenance, other Formatter flags, partial-prefix failures, arbitrary writers or all constructor histories. It adds no Aeneas API claim. The Lcg64Xsh32 serde check covers only the fixed sequence protocol, lengths0..2, five Deserialize error stages and successful six-stage serialization. Serialize error stages, arbitrary backend/map/format implementations and the other PCG serde implementations remain unproved. Arbitrary wire increments are accepted by this check; odd increment or generator invariants are not established. This Kani supplement adds no Aeneas machine claims."
environment = "Unchanged crates.io rand_pcg 0.10.2 Rust sources and Cargo.toml; original archive/hash checks, tests and regeneration comparisons retained in evidence. Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; official Aeneas frontend/library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official targeted extraction includes each actual original body, macro-expanded state helpers and private constructor helpers. Separate all-features (serde) extraction is retained in evidence/serde; generated Lean is byte-identical to the default extraction. Six additional output bodies and core::result::Result::map are included via the official --include core::result selection. Two output-permutation helper theorems are audited separately. The MCG advance extraction uses the official PcgAdvanceModel namespace. Its full-delta power/termination proof uses BitVec algebra and a decreasing natural measure, and all configured proof modules are imported together for the final audit. Three LCG advance bodies use a separate official PcgAffineAdvanceModel namespace. BitVec affine algebra and halving induction prove all deltas with increment preservation; all configured proof modules are imported together. Separate Debug supplement: Kani0.68.0/Rust nightly-2026-08-21, rand_core0.10.0 exact lock, four jobs/8925 checks; evidence/kani-debug-baseline. The distinct0.10.1 execution packet is not substituted for this baseline. Separate Lcg64Xsh32 serde Kani0.68/nightly2026-08-21, exact core0.10.0/serde1.0.228/default+serde:691checks/0fail/1unreachable. evidence/kani-pcg32-serde; only dependency path adapted for portable artifact layout. All prior25 proofs/MCGseed/Debug evidence retained."
