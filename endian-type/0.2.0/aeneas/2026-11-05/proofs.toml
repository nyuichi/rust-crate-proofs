[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "<endian_type::BigEndian as core::ops::BitAnd>::bitand"
module = "Proofs"
theorem = "Proofs.bigendian_bitand_spec"
precondition = "Arbitrary well-typed operands and arbitrary underlying Rust operator implementation, represented by its Aeneas trait dictionary. Wrapper equivalence preserves the underlying result; no assumption of callback success is required."

[[tool.proofs]]
api = "<endian_type::BigEndian as core::ops::BitOr>::bitor"
module = "Proofs"
