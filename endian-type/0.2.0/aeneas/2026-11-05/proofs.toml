[report]
title = "Integer From conversions and generic bitwise result preservation"
explanation = "For endian-type 0.2.0, six generic BigEndian/ LittleEndian bitwise methods preserve the underlying operator result. Sixty integer From method bodies additionally implement exact identity or byte reversal under explicitly supplied x86_64 little-endian scalar-operation models. LittleEndian construction and conversion to an integer preserve the stored word; BigEndian construction and conversion to an integer reverse its bytes; cross-wrapper conversion reverses the stored word. These contracts cover every bit pattern of u16/u32/u64/u128/usize and i16/i32/i64/i128/isize. Pointer-sized Lean theorems explicitly require System.Platform.numBits=64. Original source and Cargo.toml are unchanged. Fifty executable external-operation models compose official byte primitives and are proved against independent bitvector specifications; Kani separately checks native Rust operations against explicit reversed-byte references for all inputs. Separate ordinary Kani harnesses directly check forty concrete integer byte APIs (ten harnesses, 220 checks) and sixty integer instantiations of six slice methods (1030 checks, including 180 specification assertions and 20 unsupported-path guards). The slice checks are limited to initialized, correctly aligned exact-length repr(C) leading-field buffers with arbitrary contents and replacement values; they do not establish arbitrary-T, arbitrary allocation-context, invalid/short/misaligned-buffer, or Rust aliasing guarantees. These supplemental Kani checks are not among the 66 Aeneas machine claims. Separate generic Lean caller proofs cover six reflexive standard blanket operations for BigEndian<T> and LittleEndian<T>, for every represented T under the original implicit Sized bound and every represented value. From<Self> returns the same value; Borrow<Self> returns a shared view of that value; BorrowMut<Self> returns the value and an identity backward function for modeled replacement. The standard template parameter is instantiated with the whole wrapper Self, not its inner T. These are distinct from primitive/cross-endian From conversions and add no primary mappings. The Rust wrapper nominal types remain distinct even though their extracted single-field views are reducible aliases. Six additional conditional compiler-inlined caller contracts cover Into<U>, TryInto<U> and TryFrom<U> for each original wrapper. Into delegates exactly to the supplied U:From<Self> callback; TryInto delegates exactly to U:TryFrom<Self>, retaining arbitrary associated Error values. For TryFrom<U>, the supplied U:Into<Self> callback is bound into Ok with Never error type. Each equation retains modeled callback failure/divergence rather than assuming success or termination. Payload T is distinct from whole-wrapper Self; U is destination for Into/TryInto and source for TryFrom."
trusted_assumptions = "The Rust compiler, Charon/Aeneas, official scalar/byte primitives, Lean kernel, Kani and CBMC are trusted. Fifty native-endian std-operation models are explicitly supplied. Their Rust byte formulas and official Lean byte primitives are connected by review, not a mechanically checked cross-language theorem; std operator bodies are not independently proved in Lean. Kani and extraction use different Rust nightlies. The six bitwise results quantify arbitrary underlying operator dictionaries without proving user callback bodies. All 66 API contracts and 50 model specifications use only propext, Classical.choice and Quot.sound as transitive axioms. The reflexive6 supplement uses pinned Rust nightly2026-09-17 standard From/Borrow/BorrowMut sources and typed pre/post-inline MIR to connect actual public UFCS callers to original blanket implementations. It additionally trusts official compiler Inline/RemoveStorageMarkers/ReferencePropagation/DeadStoreElimination-final/SimplifyLocals-final through optimized MIR and unchanged Charon/Aeneas. Final IR has zero residual calls; some core source spans are erased by cleanup, so no universal final-span correspondence or compiler-correctness proof is claimed. No new model, type axiom or generated/source/IR edit is introduced. Conditional6 uses original pinned std09 conversion delegation bodies and six typed before/after official Inline MIR scopes; final generated IR retains one actual trait callback per caller. Dictionary correspondence to the Rust implementation and official compiler/Charon/Aeneas/library are trusted; callback implementations are not independently proved. No custom translator, model, type axiom, source/IR/generated edit or std08/std09 equivalence is supplied."
limitations = "Registered Aeneas coverage is limited to six bitwise methods and sixty concrete integer From implementations on the stated target/model domain. The forty-six byte/slice APIs and their unsafe layout/validity/aliasing obligations are not covered by these Aeneas claims. No generic arbitrary-T memory-safety, other target, endian, or pointer-width claim is established. Derived standard-trait methods are excluded. Other trait/default/blanket behavior beyond the twelve supplemental reflexive/conditional caller contracts is not verified. Type-specialized Rust identities and any erased server catalogue keys must be distinguished. Reflexive6 are supplementary compiler-inlined caller contracts, not direct default-declaration/source-card bindings or new registered APIs. Borrow values and backward functions are Aeneas functional views, not physical pointer identity, arbitrary heap/provenance/alias/lifetime or caller-replacement/Drop-effect guarantees. They establish no Rust PartialEq law or conversion between the distinct BigEndian and LittleEndian nominal types. Other configurations/targets and const evaluation are not checked. Producer namespace/type coimport did not rerun all66 old theorems; the formal integrated fresh run separately rechecks all configured primary modules with the supplement. Consolidated portable regeneration/replay remains unrun; individual successful extraction, typed MIR and kernel evidence are retained. These six conditional caller contracts do not establish arbitrary callback values/correctness/termination, Drop/panic/unwinding, global/interior effects or physical heap/alias/provenance. The modeled equality is unconditional in the dictionary model, while useful normal-result facts need the corresponding callback contract. They add no direct external-body API-card binding or primary mapping. Individual frontend/proof/type-coimport checks succeeded; corrected frontend replay permits only LLBC dest_dir output metadata relocation and checks generated Lean/JSON byte equality. The consolidated whole replay script is prepared but not run."
environment = "Original crates.io endian-type 0.2.0; x86_64-unknown-linux-gnu little-endian. Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; Aeneas/official library be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official method roots verify the six generic methods. A pure caller driver with --include endian_type extracts all sixty actual dependency bodies. Official compiler source-path remapping supports reproducible spans. Exact model/function/type/use guards and transitive axiom audits are retained. Kani 0.68.0/CBMC 6.11.0/Rust nightly-2026-08-21: ten symbolic std-model harnesses, 216 checks, zero failures. evidence/reflexive6 retains the70-file immutable packet, exact archive/source/std09 pins and independent review. Root Proofs imports the unchanged generated caller model and ReflexiveProofs; the actual CLI build target must print all six standard-axiom audits. Existing66 rows/preconditions,50 model specifications and original Rust/Cargo remain unchanged; no prior native-byte/slice Kani jobs are rerun during packaging. evidence/conditional6 preserves68 frozen source/evidence files and independent review. Root Proofs imports both ReflexiveProofs and ConditionalProofs, so actual CLI targets must compile the12 unique supplemental declarations together with all66 old primary proofs. Earlier producer type-only checks are not mislabeled as full66 theorem rechecks."
