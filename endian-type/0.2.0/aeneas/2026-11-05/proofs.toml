[report]
title = "Bitwise wrapper operations preserve the underlying operator result"
explanation = "For endian-type 0.2.0, the handwritten BitAnd, BitOr, and BitXor implementations of BigEndian<T> and LittleEndian<T> apply the corresponding underlying T operator and wrap its successful output. Each of the six proved contracts quantifies arbitrary operand and output types, operands, and operator dictionaries: the translated wrapper result equals the underlying operator result. This includes propagation of failure or divergence represented in the Aeneas result model. The wrappers add no independent failure in that model. These contracts prove the unchanged published wrapper bodies; they do not prove any user-supplied T operator implementation."
trusted_assumptions = "The Rust compiler, Charon/Aeneas translation, their standard-library models, and the Lean kernel are trusted. Underlying operator behavior is represented by an arbitrary trait dictionary, rather than asserted to implement a particular integer operation. The theorems have only propext, Classical.choice, and Quot.sound as transitive axioms."
limitations = "Only six handwritten generic bitwise operator method bodies are covered. No endian conversion, integer From implementation, byte representation, raw-pointer/slice access, transmute safety, derived standard trait implementation, or complete crate memory-safety claim is established. Concrete integer operator dictionaries are not independently proved here. Extraction/build used x86_64-unknown-linux-gnu; other targets were not checked."
environment = "Unmodified crates.io endian-type 0.2.0, no_std library, x86_64-unknown-linux-gnu. Rust nightly-2026-09-17; Charon 08d7c9d50144bd84848212c24701253585e90d1f; Aeneas be86ab0f1989d04944292b345b24c435be3ad10a; Lean 4.35.0. Official method-root selection, no source/IR/tool modifications. Six generic method-body equality theorems. cargo-proofs API discovery uses a documented official-rustc macro-expansion compatibility fallback and recognizes cfg(doctest) as false; proof compilation, exactly-one API resolution, and axiom policy are unchanged."
