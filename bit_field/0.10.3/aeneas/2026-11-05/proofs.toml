[[tool.proofs]]
api = "<[T] as bit_field::BitArray<T>>::bit_length"
module = "ArrayProofs"
theorem = "ArrayProofs.bit_length_contract"
precondition = "The translated BitField::BIT_LENGTH constant returns its declared width normally. Arbitrary element type, width and finite slice on x86_64; success and integer-overflow failure are both specified for the product."

[[tool.proofs]]
api = "<[T] as bit_field::BitArray<T>>::get_bit"
module = "ArrayBitsProofs"
theorem = "ArrayBitsProofs.get_bit_contract"
precondition = "The BitField constant returns its declared width normally, and per-element get_bit/set_bit satisfy the explicit normal-return observation/update contracts at valid local indices. Arbitrary type, slice, index and set boolean; zero-width and out-of-bounds failures are also specified. This is a callback-conditional composition proof, not a body proof of arbitrary downstream implementations."

[[tool.proofs]]
api = "<[T] as bit_field::BitArray<T>>::set_bit"
module = "ArrayBitsProofs"
theorem = "ArrayBitsProofs.set_bit_contract"
precondition = "The BitField constant returns its declared width normally, and per-element get_bit/set_bit satisfy the explicit normal-return observation/update contracts at valid local indices. Arbitrary type, slice, index and set boolean; zero-width and out-of-bounds failures are also specified. This is a callback-conditional composition proof, not a body proof of arbitrary downstream implementations."

[report]
title = "Integer single-bit operations and generic slice routing, with exact failure cases"
explanation = "The unchanged bit_field 0.10.3 single-bit methods are verified for all twelve integer types: in-range indices read or update exactly that bit, returned mutable-reference writes propagate to the original value, and invalid indices fail at the assertion. All twelve primitive BIT_LENGTH values equal their widths. The original generic slice bit_length/get_bit/set_bit bodies are also composition-proved: assuming their declared BitField constant and per-element normal-return contracts, they use element index bit/width and local index bit%width, preserve other slice entries on update, and report zero-width/out-of-bounds errors. bit_length returns length times width or integerOverflow. Rust source and Cargo.toml are archive-identical. Separately, original-Rust Kani checks cover RangeFull specializations of get_bits and set_bits for each of the twelve primitive integer types. For every scalar value, get_bits(..) returns that exact word without changing it. For every receiver and replacement, set_bits(.., replacement) replaces the complete word, returns the mutable reference containing the replacement, and a subsequent arbitrary write through it updates the original word. Signed negative values and sign bits are included. These are twenty-four closed specializations with1284 successful checks, not completion of the generic RangeBounds method families or additional machine mappings."
trusted_assumptions = "The official Rust/Charon/Aeneas translation and integer/slice models, Lean, and Kani/CBMC are trusted. The size_of model uses Lean-only PrimitiveRustLayout evidence with twelve supplied primitive instances, including pointer size8 on x86_64. The original generated Funs is unchanged: each of its twelve ground calls statically elaborates to the expected instance dictionary, checked explicitly. This added implicit evidence is not a Rust trait or an in-Lean proof of std layout. The Lean class remains extensible; coverage is the frozen twelve-call closure, not class sealing. Bool lacks an instance in the audited environment, and there is no supplied fallback for arbitrary types. Kani checks the same twelve actual layouts and all primitive single-bit/returned-reference behavior for arbitrary valid values. Connecting Kani Rust and Lean representations is a reviewed bridge, not an in-Lean std layout proof; Rust nightlies differ. Generic slice theorems assume the complete stated observation/update callback contracts, including the final state after returned-reference writeback. They do not prove arbitrary callback implementations. Mapped audits allow only propext, Classical.choice and Quot.sound. The RangeFull supplement executes original public methods and actual std size_of under Kani0.68/CBMC6.11/nightly2026-08-21, default debug x86_64 with64-bit usize/isize. Its compiler, standard and validity/panic semantics are trusted; no source adaptation, model, stub or suppressed UB check is introduced. It is independent of the Lean-only layout evidence and supplies no formal cross-tool equivalence."
limitations = "Only twenty-four primitive single-bit methods, twelve width constants and three callback-conditional slice bodies are established. General primitive and slice get_bits/set_bits range contracts remain unproved; the separate RangeFull-only Kani results described here cover closed primitive specializations. A separately Kani-checked example shows signed range behavior differs from ordinary masked updates: 112_i8.set_bits(0..4,1) yields 1, changing high bits outside the range; the unsigned example yields 113. The verified single-bit methods are unaffected. Generic callback side effects, failure/divergence outside the stated contracts, other targets and release extraction are not established. No generic Rust size_of property, panic text or unwinding-state guarantee is claimed. Signed-range diagnostic evidence: https://github.com/nyuichi/rust-crate-proofs/tree/57c4d16e1184f84353db90589bc3cb601f89cb85/batches/2026-11-05-full-public-api/diagnostics/bit-field-signed-range RangeFull denotes the whole primitive word and has no outside bits to preserve; these checks do not imply masked-update behavior for other signed intervals. Arbitrary RangeBounds implementations, bounds callbacks, general intervals, slice BitArray methods, invalid-range panic payload/unwind behavior, other targets or release configuration are not established. The separate signed small-range counterexample remains valid. All27 registered model contracts and their preconditions remain unchanged."
environment = "Original crates.io bit_field0.10.3; x86_64 default features, debug extraction. Rust nightly-2026-09-17, Charon08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean4.35.0. Official non-monomorphizing Aeneas-preset extraction for primitive roots and separate generic slice roots. The prior unsupported monomorphize/preset snapshot is retained as labeled evidence; all current contracts are rechecked from the supported path. Kani0.68.0/CBMC6.11.0/Rust nightly-2026-08-21: 24 supplementary primitive harnesses/600 checks, plus the separate concrete range observation. RangeFull24 frozen source/archive/harness/rawlogs and independent review are preserved under evidence/kani-rangefull24;1284checks0failed48unreachable, twelve primitive types times get/set. This supplemental evidence adds zero registered Aeneas claims."
