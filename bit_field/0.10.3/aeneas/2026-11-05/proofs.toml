[[tool.proofs]]
api = "<[T] as bit_field::BitArray<T>>::bit_length"
module = "ArrayProofs"
theorem = "ArrayProofs.bit_length_contract"
precondition = "The translated BitField::BIT_LENGTH constant returns its declared width normally. Arbitrary element type, width and finite slice on x86_64; success and integer-overflow failure are both specified for the product."

[report]
title = "Exact integer bit operations and generic slice bit lengths"
explanation = "For bit_field 0.10.3, the unchanged get_bit and set_bit bodies are verified for all twelve signed and unsigned integer types on x86_64. Every in-range index reads the requested bit or sets/clears exactly that bit; other bits are preserved. set_bit returns a mutable reference to the updated integer, and subsequent writes through that reference update the original value. Every out-of-range index fails at the explicit assertion. All twelve BIT_LENGTH values equal the integer widths. The original generic slice bit_length body returns length times the declared BitField width when the product fits usize, and fails with integer overflow otherwise, assuming the trait constant returns that width normally. Original Rust source and Cargo.toml are unchanged. The Lean proofs use twelve explicit, separately monomorphized size_of integer layout models; Kani independently checks the original methods, returned-reference behavior and layout values for arbitrary valid inputs."
trusted_assumptions = "The official Charon/Aeneas translation and scalar models, Rust compiler, Lean kernel, and Kani/CBMC are trusted. Twelve executable models supply size_of for the twelve integer types, with x86_64 byte sizes 1,2,4,8,16 and pointer size 8. No model is provided for arbitrary other Rust types. Kani layout/formula checks and Lean bitvector models are a reviewed semantic bridge, not mechanically connected proofs of Rust standard-library layout in Lean. The pointer-sized theorems explicitly assume System.Platform.numBits=64. All mapped transitive axiom audits permit only propext, Classical.choice and Quot.sound."
limitations = "The integer get_bit/set_bit methods, primitive BIT_LENGTH values, and generic slice bit_length composition are established under their stated conditions. The get_bits/set_bits range methods, remaining BitArray slice methods, downstream trait implementations, other targets and release extraction remain unproved. The out-of-range result describes the translated explicit assertion failure, not panic text or unwinding side effects. Kani checks valid-index original method behavior and layout; Lean separately proves invalid-index assertion failure. Kani and Aeneas use different Rust nightly versions. The bit_length theorem assumes the BitField constant value; it does not body-prove arbitrary downstream trait implementations. This is partial crate coverage, not a proof of all public APIs."
environment = "Original crates.io bit_field 0.10.3; x86_64-unknown-linux-gnu; default features; debug extraction. Rust nightly-2026-09-17, Charon 08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean4.35.0. Official targeted wildcard extraction with --monomorphize and split files. Kani0.68.0/CBMC6.11.0/Rust nightly-2026-08-21: 24 supplementary harnesses, 600 checks, no failures."
