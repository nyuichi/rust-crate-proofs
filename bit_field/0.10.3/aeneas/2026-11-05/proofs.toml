[[tool.proofs]]
api = "<[T] as bit_field::BitArray<T>>::bit_length"
module = "ArrayProofs"
theorem = "ArrayProofs.bit_length_contract"
precondition = "The translated BitField::BIT_LENGTH constant returns its declared width normally. Arbitrary element type, width and finite slice on x86_64; success and integer-overflow failure are both specified for the product."

[[tool.proofs]]
api = "<[T] as bit_field::BitArray<T>>::get_bit"
module = "ArrayBitsProofs"
theorem = "ArrayBitsProofs.get_bit_contract"
precondition = "The BitField constant returns its declared width normally, and per-element get_bit/set_bit satisfy the explicit normal-return observation/update contracts at valid local indices. Arbitrary type, slice, index and set boolean; zero-width and out-of-bounds failures are also specified. This is a callback-conditional composition proof, not a body proof of arbitrary downstream implementations."

[[tool.proofs]]
api = "<[T] as bit_field::BitArray<T>>::set_bit"
module = "ArrayBitsProofs"
theorem = "ArrayBitsProofs.set_bit_contract"
precondition = "The BitField constant returns its declared width normally, and per-element get_bit/set_bit satisfy the explicit normal-return observation/update contracts at valid local indices. Arbitrary type, slice, index and set boolean; zero-width and out-of-bounds failures are also specified. This is a callback-conditional composition proof, not a body proof of arbitrary downstream implementations."

[report]
title = "Integer single-bit operations and generic slice routing, with exact failure cases"
explanation = "The unchanged bit_field 0.10.3 single-bit methods are verified for all twelve integer types: in-range indices read or update exactly that bit, returned mutable-reference writes propagate to the original value, and invalid indices fail at the assertion. All twelve primitive BIT_LENGTH values equal their widths. The original generic slice bit_length/get_bit/set_bit bodies are also composition-proved: assuming their declared BitField constant and per-element normal-return contracts, they use element index bit/width and local index bit%width, preserve other slice entries on update, and report zero-width/out-of-bounds errors. bit_length returns length times width or integerOverflow. Rust source and Cargo.toml are archive-identical."
trusted_assumptions = "The official Rust/Charon/Aeneas translation and integer/slice models, Lean, and Kani/CBMC are trusted. Twelve explicit monomorphized size_of models supply the integer byte sizes on x86_64, including pointer size 8; Kani checks their actual layouts and all primitive single-bit methods/returned-reference behavior for arbitrary valid values. Connecting Kani Rust and Lean representations is a reviewed bridge, not an in-Lean std layout proof; Rust nightlies differ. Generic slice theorems assume the complete stated observation/update callback contracts, including the final state after returned-reference writeback. They do not prove arbitrary callback implementations. Mapped audits allow only propext, Classical.choice and Quot.sound."
limitations = "Only twenty-four primitive single-bit methods, twelve width constants and three callback-conditional slice bodies are established. Primitive and slice get_bits/set_bits range methods remain unproved. A separately Kani-checked example shows signed range behavior differs from ordinary masked updates: 112_i8.set_bits(0..4,1) yields 1, changing high bits outside the range; the unsigned example yields 113. The verified single-bit methods are unaffected. Generic callback side effects, failure/divergence outside the stated contracts, other targets and release extraction are not established. No generic Rust size_of property, panic text or unwinding-state guarantee is claimed."
environment = "Original crates.io bit_field0.10.3; x86_64 default features, debug extraction. Rust nightly-2026-09-17, Charon08d7c9d50144bd84848212c24701253585e90d1f, Aeneas be86ab0f1989d04944292b345b24c435be3ad10a, Lean4.35.0. Official original-body extraction with primitive monomorphization and separate generic slice roots. Kani0.68.0/CBMC6.11.0/Rust nightly-2026-08-21: 24 supplementary primitive harnesses/600 checks, plus the separate concrete range observation."
