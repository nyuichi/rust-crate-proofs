[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = "proofs"

[[tool.proofs]]
api = "normalized"
module = "Proofs"
theorem = "Proofs.normalized_spec"
precondition = "The underlying iterator is the total, fused finite-character-list model; the observation budget exceeds the input length. The extracted source replaces three character patterns with equality guards."

[report]
title = "CR/LF/CRLF normalization for finite character lists (adapted source)"
explanation = "For every finite character list, the Aeneas translation of normalize-line-endings 0.3.0's adapted normalized constructor and Iterator::next returns exactly the list obtained by replacing each CRLF pair and each remaining CR with LF, while preserving other characters. The proof uses a total, fused list iterator and an observation budget greater than the input length, with no fixed input bound. The output contains no CR, is no longer than the input, and is unchanged by another normalization pass. The constructor and next bodies are dependencies of the checked public theorem. Extraction required replacing three character patterns with equivalent equality guards; the theorem applies to this adapted source."
trusted_assumptions = "The Rust compiler, Charon/Aeneas translation, their standard-library models, and the Lean kernel are trusted. The input iterator is modeled as consuming one character per successful call and returning None permanently after exhaustion. No additional local axioms are used; the public theorem depends only on Lean's propext, Classical.choice, and Quot.sound."
limitations = "The original crates.io source is retained unchanged, but its character-pattern switches are unsupported by the pinned Aeneas translator. The three guard replacements were independently reviewed by source comparison; equivalence to the published implementation was not machine-proved. The formal guarantee therefore applies to the adapted extraction and does not independently establish the same guarantee for the release. Arbitrary external iterators, their panics or divergence, and iterators that resume after None are outside the end-to-end theorem. No separate general memory-safety claim is made."
environment = "Aeneas be86ab0f1989d04944292b345b24c435be3ad10a; Charon 08d7c9d50144bd84848212c24701253585e90d1f; Rust nightly-2026-09-17; Lean 4.35.0. Proofs.normalized_spec is checked by lake build and a transitive axiom audit. Source archives, adaptation patch, generated Lean, translation manifest, and recorded results are included. cargo-proofs 0.4.1 uses a local environment-CA addition for TLS; its proof adapter and axiom audit are unchanged."
